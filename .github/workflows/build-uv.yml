name: Build (uv)

# The Python side: the inference service packages in `packages/`, built and
# tested with uv. Separate from build.yml so each workflow's path filter can
# state what its jobs actually cover — a single filter spanning both languages
# is how the Python suite came to be skipped on a packages-only change, and it
# would also run every Rust job for a change to a service's README.

on:
  push:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      # Owns the per-service requirements export the `services` job depends on.
      - "scripts/**"
      - ".github/workflows/build-uv.yml"
  pull_request:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - ".github/workflows/build-uv.yml"
  workflow_dispatch:

env:
  UV_VERSION: "0.13.5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync tooling
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  core:
    name: Core
    runs-on: ubuntu-latest
    needs: ruff

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # elide-core is a library with no lock of its own; it is tested in the
      # root tooling environment, which installs it.
      - name: Sync tooling
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  services:
    name: Service ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ruff
    strategy:
      fail-fast: false
      matrix:
        service: [ner, ocr, stt]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync
        run: uv sync --locked --project packages/elide-${{ matrix.service }}

      # The requirements file is exported from the service's uv.lock at image
      # build time rather than committed. Running the export here keeps the
      # Bento image inputs covered: it fails if the lock as committed no longer
      # matches the service's manifest.
      - name: Export requirements
        run: python3 scripts/gen_requirements.py elide-${{ matrix.service }}

      # From the repository root: the service module resolves its exported
      # requirements against the working directory when imported.
      - name: Run tests
        run: >-
          uv run --locked --project packages/elide-${{ matrix.service }}
          pytest packages/elide-${{ matrix.service }}

  # Which services `real-models` runs: those whose code, shared core,
  # requirements export or this workflow changed, so a change to one service
  # downloads only its weights. Every service on a manual dispatch, and on a
  # push with no usable base (a new branch, a force push).
  changes:
    name: Changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.diff.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all='["ner","ocr","stt"]'
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "services=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          shared='^(packages/elide-core/|scripts/gen_requirements\.py$|\.github/workflows/build-uv\.yml$)'
          if echo "$changed" | grep -qE "$shared"; then
            echo "services=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          services=$(for s in ner ocr stt; do
            if echo "$changed" | grep -q "^packages/elide-$s/"; then printf '"%s",' "$s"; fi
          done)
          echo "services=[${services%,}]" >> "$GITHUB_OUTPUT"

  # Real weights and real inference, for what fakes cannot catch: a pinned
  # model that no longer resolves, a library whose API or output moved, an
  # offline load that reaches for the network. Run when the service changes,
  # because that is when one of those can break.
  real-models:
    name: Real models ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ruff, changes]
    if: needs.changes.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # The OCR test renders Polish and Czech names, which need a font that
      # has their letters.
      - name: Install fonts
        if: matrix.service == 'ocr'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Sync
        run: uv sync --locked --project packages/elide-${{ matrix.service }}

      - name: Export requirements
        run: python3 scripts/gen_requirements.py elide-${{ matrix.service }}

      # `-m real` overrides the `-m "not real"` each service's pyproject.toml
      # sets for the default run.
      - name: Run real-model tests
        run: >-
          uv run --locked --project packages/elide-${{ matrix.service }}
          pytest packages/elide-${{ matrix.service }} -m real
