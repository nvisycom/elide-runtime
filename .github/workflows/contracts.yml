name: BentoML

# Cross-language checks for the Python-owned HTTP contracts and Rust adapters.
# The E2E job runs real BentoML applications in Testcontainers with fake models.

on:
  push:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/elide-core/**"
      - "packages/elide-ner/**"
      - "packages/elide-ocr/**"
      - "packages/elide-stt/**"
      - "crates/adapter/elide-bentoml/**"
      - "contracts/**"
      - "scripts/gen_contracts.py"
      - "scripts/contract_fixtures.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/elide-core/**"
      - "packages/elide-ner/**"
      - "packages/elide-ocr/**"
      - "packages/elide-stt/**"
      - "crates/adapter/elide-bentoml/**"
      - "contracts/**"
      - "scripts/gen_contracts.py"
      - "scripts/contract_fixtures.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  UV_VERSION: "0.13.5"
  TYPIFY_VERSION: "0.5.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Install nightly formatter
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install pinned Rust type generator
        run: cargo install cargo-typify --version "$TYPIFY_VERSION" --locked

      - name: Sync contract dependencies
        run: uv sync --locked --package elide-core --group dev

      - name: Check generated schemas, fixtures, and Rust types
        run: uv run --no-sync python scripts/gen_contracts.py --check

      - name: Validate Python contract and fixtures
        run: >-
          uv run --no-sync pytest
          packages/elide-core/tests/test_contracts.py
          packages/elide-core/tests/test_ner_contract.py
          packages/elide-core/tests/test_ner_v1.py
          packages/elide-core/tests/test_ocr_v1.py
          packages/elide-core/tests/test_stt_v1.py

      - name: Test Rust contract and adapter
        run: cargo test --locked -p elide-bentoml --lib

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Run end-to-end tests
        run: cargo test --locked -p elide-bentoml --test ner --test ocr --test stt -- --ignored
