name: Docker

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/**"
      - "docker/**"
      - "scripts/gen_requirements.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  UV_VERSION: "0.13.5"
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The publish job raises `packages: write` for itself,
# so a pull-request build cannot push an image.
permissions:
  contents: read

jobs:
  # One job per service: a failure in one does not mask the others, and the
  # three build in parallel. The matrix mirrors `SERVICES` in the Makefile.
  #
  # Each architecture builds on its own native runner, never under QEMU: an
  # emulated PyTorch import is slow enough that the service never finishes
  # loading its model (#506), so an emulated build would be untestable even if
  # it completed. GitHub's arm64 runners are free for this public repository.
  #
  # A tag pushes one image per service per architecture, suffixed `-amd64` /
  # `-arm64`; the `manifest` job below merges each pair into the single tag an
  # operator pulls.
  build:
    name: Build ${{ matrix.service }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Only consumed by the tag-gated push steps at the end of this job.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ner, ocr, stt]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-packages

      # BentoML builds the image from service.py and bentofile.yaml, so there
      # is no Dockerfile and no docker/build-push-action here.
      #
      # Driven through `make` rather than a copy of the commands: the build has
      # several non-obvious requirements (run from the repo root so the
      # requirements export resolves, two steps because `--containerize` takes
      # no tag, the bento's content-hash tag captured for `containerize -t`),
      # and a second copy here drifts from the one developers run. `make`
      # exports the requirements as a prerequisite, so that step is implicit.
      - name: Build image
        run: make services-image SERVICES=${{ matrix.service }}

      - name: Tag for this commit
        run: |
          docker tag "elide-${{ matrix.service }}:latest" \
            "elide-${{ matrix.service }}:${{ github.sha }}"

      # Publishing an unscanned image would be a gap next to the repo's
      # existing advisory gates. Scanned before any push, and on pull requests
      # too, so a vulnerable dependency surfaces on the PR that introduces it.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: elide-${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Pushed from this job rather than handed to a separate one through an
      # artifact: the image is 2-3 GB, and saving, uploading, downloading and
      # reloading it buys nothing over pushing from the runner that built it.
      #
      # The trade-off is that `packages: write` is held by the job that also
      # runs the build. It is still unreachable on a pull request — the steps
      # below are tag-gated, and a fork's token is read-only regardless.
      - name: Log in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture pushes its own suffixed tag; the `manifest` job
      # merges the pair. Nothing here writes the plain `:<version>` tag, so an
      # operator never sees a single-architecture image under the tag they
      # pull — it appears only once both architectures exist.
      #
      # The suffixed tags are kept rather than cleaned up: the manifest refers
      # to those digests, so deleting them would break the tag an operator
      # pulls. They are also what makes a single architecture reproducible
      # when debugging a platform-specific report.
      - name: Tag and push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/elide-${{ matrix.service }}
          BUILT: elide-${{ matrix.service }}:${{ github.sha }}
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          docker tag "$BUILT" "$IMAGE:$version-${{ matrix.arch }}"
          docker push "$IMAGE:$version-${{ matrix.arch }}"

  # Merges each service's per-architecture images into the one tag an operator
  # pulls, so `docker pull` resolves to the host's architecture.
  #
  # Needs every build: a manifest naming an image that failed to push would
  # fail here, and `fail-fast: false` above means one architecture failing does
  # not cancel the other, so this is the gate that keeps a half-published tag
  # from appearing.
  #
  # The tag drives the version: v1.2.3 publishes :1.2.3 and moves :latest.
  # `latest` is a convenience for a quick start; a deployment pins the version,
  # which is what docker/.env.example says to do.
  #
  # A prerelease publishes its own version tag but does not move :latest —
  # v0.1.0-rc.1 must not become the image someone gets by default, least of all
  # after 0.1.0 exists. Detected by the `-` SemVer uses to introduce a
  # prerelease, so v0.1.0-rc.1, -beta and -alpha.2 all qualify.
  manifest:
    name: Manifest ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ner, ocr, stt]

    steps:
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge the per-architecture images
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/elide-${{ matrix.service }}
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"

          # The version tag always; `latest` only for a real release. A
          # prerelease must not become the image someone gets by default,
          # least of all after that version ships. Keyed on the `-` SemVer
          # uses to introduce a prerelease, matching how release.yml decides
          # whether to mark the GitHub Release itself a prerelease.
          tags="$version"
          case "$version" in
            *-*) echo "$version is a prerelease; leaving :latest alone." ;;
            *)   tags="$tags latest" ;;
          esac

          for tag in $tags; do
            echo "Creating $IMAGE:$tag"
            docker buildx imagetools create \
              --tag "$IMAGE:$tag" \
              "$IMAGE:$version-amd64" \
              "$IMAGE:$version-arm64"
          done

      - name: Show the published manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/elide-${{ matrix.service }}
        run: docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}"
