name: Inference Build

on:
  push:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/inference-build.yml"
  pull_request:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/inference-build.yml"
  # Weekly real-model run (the real-models job is gated on non-PR events below).
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Service requirements up to date
        run: uv run python scripts/gen_requirements.py --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-packages

      - name: Run tests
        run: uv run pytest

  real-models:
    name: Real models
    runs-on: ubuntu-latest
    needs: lint
    # Opt-in only: the scheduled weekly run or a manual dispatch — never on PRs
    # or pushes, since it downloads weights and runs real inference.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-packages

      - name: Run real-model tests
        run: uv run pytest -m real
