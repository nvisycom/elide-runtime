name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Nothing is published to crates.io today: the workspace sets
  # `publish = false`, inherited by every crate, because these crates depend on
  # `elide` as a git dependency and crates.io rejects a package whose
  # dependencies are not themselves published. Pinning a commit is how a
  # consumer depends on this, which is what the README says.
  #
  # The job is kept wired, and asserts that state rather than publishing: if a
  # crate is ever opened up for release, this fails and the step below has to
  # be replaced with the real `cargo publish` calls in dependency order. A
  # deleted job would have left a tag silently publishing nothing.
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Assert nothing is publishable yet
        run: |
          publishable=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          if [ -n "$publishable" ]; then
            echo "These crates are now publishable, but this job does not" >&2
            echo "publish them. Replace this step with cargo publish calls" >&2
            echo "in dependency order:" >&2
            echo "$publishable" >&2
            exit 1
          fi
          echo "No crate is publishable (workspace sets publish = false)."
