name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Runs before the release is created, so a workspace that has become
  # publishable stops the tag rather than leaving a public release behind.
  #
  # Nothing is published to crates.io today: the workspace sets
  # `publish = false`, inherited by every crate, because these crates depend on
  # `elide` as a git dependency and crates.io rejects a package whose
  # dependencies are not themselves published. Pinning a commit is how a
  # consumer depends on this, which is what the README says.
  #
  # This asserts that state rather than publishing. If a crate is ever opened
  # up, it fails naming the crate, which is the moment to add the real
  # `cargo publish` calls in dependency order. A deleted job would have left a
  # tag silently publishing nothing.
  check-publishable:
    name: Check crates.io scope
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Assert nothing is publishable yet
        # pipefail: without it a failing `cargo metadata` leaves jq with no
        # input, jq exits 0, and the empty result reads as "nothing
        # publishable" — the assertion would pass on a broken manifest.
        run: |
          set -o pipefail
          publishable=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name')
          if [ -n "$publishable" ]; then
            echo "These crates are now publishable, but nothing here" >&2
            echo "publishes them. Add cargo publish calls in dependency" >&2
            echo "order before tagging:" >&2
            echo "$publishable" >&2
            exit 1
          fi
          echo "No crate is publishable (workspace sets publish = false)."

  # docker/compose.yaml and the images are one versioned unit: the file sets
  # settings, caches and warmers that only images from the same commit
  # understand. A release whose compose file still pulls an older version's
  # images is broken for everyone who runs `docker compose up`, and rc.5 and
  # rc.6 both shipped that way. Checked before the release exists, so a
  # forgotten bump stops the tag rather than leaving a public release behind.
  check-compose-version:
    name: Check compose version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the compose defaults name this release
        run: sh scripts/check_compose_version.sh "${GITHUB_REF_NAME#v}"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [check-publishable, check-compose-version]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `prerelease` is derived rather than hardcoded: a tag like v0.1.0-rc.1
      # published as a stable release is what GitHub shows as "Latest", and
      # what a consumer reads as ready. Keyed on the `-` SemVer uses to
      # introduce a prerelease, matching how docker.yml decides whether to move
      # the `:latest` image tag.
      - name: Get the version
        id: get_version
        run: |
          set -o pipefail
          version="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ steps.get_version.outputs.PRERELEASE }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
