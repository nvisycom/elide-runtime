name: Security (uv)

# The Python side: audits the dependency set each uv.lock resolves. Separate from
# security.yml so each path filter states what its job actually audits — a
# shared filter meant a uv.lock change did not trigger this, and a crates-only
# change ran it for nothing.

on:
  push:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-uv.yml"
  pull_request:
    branches:
      - "main"
      - "release"
    paths:
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/security-uv.yml"
  # Weekly regardless of changes: an advisory is published against a
  # dependency set that has not moved, so a push-triggered audit alone would
  # not find it.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  UV_VERSION: "0.13.5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    # One lock per project: the root tooling project and each service.
    strategy:
      fail-fast: false
      matrix:
        project: [".", packages/elide-ner, packages/elide-ocr, packages/elide-stt]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing here talks to git after the checkout, so the token does
          # not need to stay in .git/config where a later step could read it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # `uv audit` reads uv.lock directly — no requirements export, no pip, no
      # dependency resolution. That matters beyond tidiness: the torch pins are
      # `+cpu` local versions from the PyTorch CPU index, and pip-audit (which
      # resolves the exported file with plain pip) cannot see that index, so it
      # failed with "No matching distribution found for torch==2.14.1+cpu".
      # Auditing the lock also audits exactly what we ship, rather than
      # whatever a fresh resolution picks.
      #
      # No `--ignore` flags: the two advisories this job used to carry
      # (CVE-2025-3000 in torch, PYSEC-2026-3624 in lightning) are both fixed
      # in versions the lock now pins — torch 2.14.1 and pytorch-lightning
      # 2.6.6 — confirmed against OSV, which reports no vulnerabilities for
      # either. Prefer `--ignore-until-fixed <ID>` over `--ignore` if one is
      # ever needed again: it expires the exemption as soon as a fix exists,
      # instead of outliving the problem the way those two did.
      #
      # `--python-platform linux`: the images are linux, and an audit of the
      # developer's own platform would miss a linux-only advisory.
      - name: Audit dependencies
        run: |
          set -o pipefail
          uv audit --locked --project "${{ matrix.project }}" \
            --python-platform linux --preview-features audit
