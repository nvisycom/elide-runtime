# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
    "./crates/elide-bento",
    "./crates/nvisy-engine",
    "./crates/nvisy-policy",
    "./crates/nvisy-schema",
    "./crates/nvisy-template",
]
# Python (uv) workspace lives in `packages/`. Excluded so cargo
# doesn't glob-scan it or complain about missing Cargo.toml files.
exclude = ["packages/"]

[workspace.package]
version = "0.1.0"
rust-version = "1.95"
edition = "2024"
license = "Apache-2.0"
publish = false

authors = ["nvisy <contact@nvisy.com>"]
repository = "https://github.com/nvisycom/runtime"
homepage = "https://github.com/nvisycom/runtime"
documentation = "https://docs.rs/nvisy-runtime"

[workspace.dependencies]
# Default features are disabled for certain dependencies to allow
# downstream workspaces/crates to selectively enable them as needed.
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329

# Elide crates
elide = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }
elide-core = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }
elide-ner = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }
elide-ocr = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }
elide-operator = { git = "https://github.com/nvisycom/elide", branch = "main", default-features = false }

# Elide extensions
elide-bento = { path = "./crates/elide-bento", version = "0.1.0" }

# Internal crates
nvisy-engine = { path = "./crates/nvisy-engine", version = "0.1.0" }
nvisy-policy = { path = "./crates/nvisy-policy", version = "0.1.0" }
nvisy-schema = { path = "./crates/nvisy-schema", version = "0.1.0" }
nvisy-template = { path = "./crates/nvisy-template", version = "0.1.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
schemars = { version = "1.0", features = ["uuid1", "bytes1"] }
csv = { version = "1.3", features = [] }

# Derive macros and error handling
thiserror = { version = "2.0", features = [] }
derive_more = { version = "2.0", features = ["add_assign", "as_ref", "deref", "deref_mut", "display", "from", "from_str", "into", "into_iterator", "is_variant", "try_into"] }
derive_builder = { version = "0.20", features = [] }
strum = { version = "0.28", features = ["derive"] }

# Primitive datatypes
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }
bytes = { version = "1.0", features = ["serde"] }
hipstr = { version = "0.8", features = ["serde"] }
jiff = { version = "0.2", features = ["serde"] }
semver = { version = "1.0", features = ["serde"] }

# Encoding and hashing
base64 = { version = "0.23", features = [] }
sha2 = { version = "0.11", features = [] }

# Test utilities
tempfile = { version = "3.10", features = [] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Async runtime and parallelism
tokio = { version = "1.50", features = [] }
tokio-util = { version = "0.7", features = [] }
futures = { version = "0.3", features = [] }
async-trait = { version = "0.1", features = [] }

# Observability
tracing = { version = "0.1", features = ["attributes"] }

# AI / LLM frameworks
bentoml = { version = "0.5", default-features = false, features = ["rustls-tls", "tracing"] }
