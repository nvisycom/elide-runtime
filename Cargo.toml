# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "2"
members = [
    "./crates/nvisy-core",
    "./crates/nvisy-engine",
    "./crates/nvisy-ingest",
    "./crates/nvisy-object",
    "./crates/nvisy-pattern",
    "./crates/nvisy-pipeline",
    "./crates/nvisy-ontology",
    "./crates/nvisy-python",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.85"
edition = "2024"
license = "MIT"
publish = false

authors = ["nvisy <contact@nvisy.com>"]
repository = "https://github.com/nvisycom/runtime"
homepage = "https://github.com/nvisycom/runtime"
documentation = "https://docs.rs/nvisy-runtime"

[workspace.dependencies]
# Default features are disabled for certain dependencies to allow
# downstream workspaces/crates to selectively enable them as needed.
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329

# Internal crates
nvisy-core = { path = "./crates/nvisy-core", version = "0.1.0" }
nvisy-engine = { path = "./crates/nvisy-engine", version = "0.1.0" }
nvisy-ingest = { path = "./crates/nvisy-ingest", version = "0.1.0" }
nvisy-object = { path = "./crates/nvisy-object", version = "0.1.0" }
nvisy-pattern = { path = "./crates/nvisy-pattern", version = "0.1.0" }
nvisy-pipeline = { path = "./crates/nvisy-pipeline", version = "0.1.0" }
nvisy-ontology = { path = "./crates/nvisy-ontology", version = "0.1.0" }
nvisy-python = { path = "./crates/nvisy-python", version = "0.1.0" }

# Async runtime
tokio = { version = "1", features = [] }
tokio-util = { version = "0.7", features = [] }
futures = { version = "0.3", features = [] }
async-trait = { version = "0.1", features = [] }

# Observability
tracing = { version = "0.1", features = [] }

# (De)serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }

# Error handling
thiserror = { version = "2.0", features = [] }
anyhow = { version = "1.0", features = [] }
derive_more = { version = "1", features = ["display"] }

# Primitive datatypes
uuid = { version = "1", features = ["serde", "v4", "v7"] }
bytes = { version = "1", features = ["serde"] }

# Text processing
regex = { version = "1.0", features = [] }
aho-corasick = { version = "1", features = [] }

# Graph data structures
petgraph = { version = "0.8", features = [] }

# File type detection
infer = { version = "0.19", features = [] }

# JSON Schema generation
schemars = { version = "1", features = ["uuid1", "bytes1"] }

# Python interop
pyo3 = { version = "0.23", features = [] }

# S3-compatible object storage
minio = { version = "0.3", features = [] }

# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
imageproc = "0.25"

# Document parsing
pdf-extract = "0.7"
lopdf = "0.34"
scraper = "0.22"
calamine = "0.33"
zip = "2"
quick-xml = "0.37"
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow"] }

# Time
jiff = { version = "0.2", features = ["serde"] }

# Interned strings
hipstr = "0.6"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Enum derives
strum = { version = "0.26", features = ["derive"] }

# Testing
tempfile = "3"

# Randomness
rand = { version = "0.9", features = [] }
