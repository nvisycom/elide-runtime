# Nvisy configuration
#
# Copy to Nvisy.toml (or run `make generate-config`), then edit as
# needed. The server loads Nvisy.toml by default; override with
# --config or NVISY_CONFIG.
#
# All sections are optional: omitted sections use server defaults.

# CLI flags (--host, --port, --data-dir) override these.
[server]
host = "0.0.0.0"
port = 8080
shutdown_timeout = "30s"
data_dir = "./data"

[server.observability]
level = "info"               # any tracing_subscriber filter directive
format = "json"              # json | text

[server.middleware]
body_limit_mb = 4
request_timeout = "5m"
cors = { allowed_origins = ["*"], max_age = "1h" }

# The deployment default for AnalyzerParams. Requests carry
# per-field `analyzer` overrides on top of this default (inherit
# the slot, replace it, remove it from an optional slot, or patch
# a list with extend + remove selectors). Omit the whole
# [analyzer] section and the server falls back to the type-level
# default — no recognizers, no enrichers, default dedup + scope,
# empty catalog — useful for tests, not useful in production.

# Caller-asserted scope, grouped under `[analyzer.scope]`. Engine
# assembles these four knobs into elide's `Scope` at compile time
# alongside a server-minted correlation id.
#
# - `languages`: structured `Language` entries each with a
#   `language` tag and `provenance` of `"asserted"` or `"detected"`.
# - `countries`: ISO 3166-1 alpha-2 codes.
# - `labels`: document-level classification labels.
# - `labelCatalog`: the per-request entity-label catalog (see
#   nested table below).
[analyzer.scope]
languages = []
countries = []
labels = []
# Example asserting two languages and a jurisdiction:
# languages = [
#   { language = "en", provenance = "asserted" },
#   { language = "es", provenance = "asserted" },
# ]
# countries = ["US", "GB"]

# Deduplication pipeline applied after recognition:
# calibrate → reconcile (merging, same-label) → reconcile
# (tiebreaking, cross-label) → filter.
[analyzer.deduplication]
merging = "max" # max | noisy_or
tiebreaker = "highest_confidence" # highest_confidence | longest_span
min_confidence = 0.7 # filter threshold, 0.0..=1.0

# Per-request label catalog. Two sources union into one catalog at
# compile time: `builtins` (names from `elide-core`'s shipped
# builtin set; unknown names warn and are skipped) and `custom`
# (inline LabelSchema records, `{ name, description?, tags?,
# metadata? }`). Requests can scalar-replace this wholesale.
[analyzer.scope.label_catalog]
builtins = ["email_address", "phone_number", "credit_card"]
# [[analyzer.scope.label_catalog.custom]]
# name = "internal_employee_id"
# tags = ["pii"]

# Pattern recognizer: at-most-one per analyzer. Loads every
# shipped pattern + dictionary and wraps the recognizer in
# elide's context-boost layer.
[analyzer.recognizers.pattern]
builtins = true
context_enhanced = true

# NER recognizer list. Each entry needs a unique `name`; multiple
# entries run in parallel (e.g. one English model, one Spanish).
[[analyzer.recognizers.ner]]
name = "default_ner"
kind = "bento"
base_url = "http://localhost:3000"
model = "REPLACE_ME"

# Language enricher (writes the document's detected languages
# into the recognizer context, driving jurisdiction-aware
# dispatch). At-most-one per analyzer; text modality only.
# `candidates` scopes the lingua detector to a candidate pool —
# empty considers every language lingua was compiled with.
[analyzer.enrichers.language]
candidates = ["en", "es", "fr"]

# OCR enricher (image modality only). At-most-one per analyzer.
[analyzer.enrichers.ocr]
kind = "bento"
base_url = "http://localhost:3001"
model = "REPLACE_ME"

# STT enricher (audio modality only). At-most-one per analyzer.
[analyzer.enrichers.stt]
kind = "bento"
base_url = "http://localhost:3002"
model = "REPLACE_ME"

# LLM recognizer lineup. Each entry is one recognizer instance:
# provider `kind` + its per-kind fields sit inline alongside
# `name` (no nested table). Optional Jinja2 prompt and modality
# filter follow (`modalities` defaults to `["text"]`).
#
# Turning `analyzer.recognizers.llm = true` on a request runs
# every entry here whose `modalities` matches the analyzer.
# Missing lineup + `llm = true` fails the analyzer compile with
# a validation error.
#
# Supported provider `kind`s: `open-ai`, `anthropic`, `gemini`,
# `ollama`. All except `ollama` need `api_key`; `ollama`
# optionally takes `base_url` (default: http://localhost:11434).
#
# ⚠ `api_key` is a secret. Keep this example file free of real
# keys; write real values into your deployment's `Nvisy.toml`
# via a secrets manager (Doppler, Vault, 1Password) at deploy
# time, and gitignore that file.
#
# OpenAI example (commented — needs an API key):
# [[llm.recognizers]]
# name = "gpt-general"
# kind = "open-ai"
# api_key = "REPLACE_ME"
# model = "gpt-4o-mini"
# modalities = ["text"]

# Ollama — local, no API key. Runs against `ollama serve` at
# http://localhost:11434 by default; override with `base_url`.
[[llm.recognizers]]
name = "llama-local"
kind = "ollama"
model = "llama3.1:8b"
modalities = ["text"]
