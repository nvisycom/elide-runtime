# Nvisy configuration
#
# Copy to Nvisy.toml (or run `make generate-config`), then edit as needed.
# The server loads Nvisy.toml by default; override with --config or NVISY_CONFIG.
#
# All sections are optional — omitted sections use runtime defaults.
# Per-request overrides (in the JSON request body) replace entire
# [engine] / [redaction] sections; `[extraction.*]` and `[detection.*]`
# are built once at startup and shared across runs (overrides would
# force model reloads and defeat the amortization).

version = "0.1.0"

# Server binding and storage.
# CLI flags (--host, --port, --data-dir) override these.
[server]
host = "0.0.0.0"
port = 8080
shutdown_timeout = "30s"
data_dir = "./data"

[server.observability]
level = "info"               # any tracing_subscriber filter directive
format = "json"              # json | text

[server.middleware]
body_limit_mb = 4
request_timeout = "5m"
cors = { allowed_origins = ["*"], max_age = "1h" }

# Engine-level resource limits and shared infrastructure.
[engine]
concurrency = 4              # max parallel documents in flight

# Run-level resource limits.
[engine.limits]
run_timeout = "60s"

# Shared HTTP client for all downstream provider calls.
[engine.http]
max_retries = 3
timeout = "120s"
connect_timeout = "10s"
idle_timeout = "90s"

# Extraction registry.
#
# Each opted-in `[extraction.*]` section is built once at server
# startup. Set `enabled = false` to keep the config but skip
# construction and dispatch. The pipeline `Extraction` step carries
# per-call flags only.

# OCR text extraction from image documents.
#
# Backend selection lives under `[extraction.ocr.backend]`. Two
# backends ship today:
#
#   kind = "noop"
#     Produces no OCR results. The default; used when image content
#     is accepted but not OCR'd.
#
#   kind = "bento"
#     Calls the externalised `inference-ocr` Bento at `base_url`.
#     **Scaffolding only** — the wire contract has not been
#     finalised upstream (https://github.com/nvisycom/runtime/issues/128).
#     Requires the runtime to be built with the `bento` feature.
#
# Cloud OCR backends (AWS Textract, Google Cloud Vision, Azure
# Document Intelligence) were removed; reintroduction is tracked
# under #201 / #202 / #203.
[extraction.ocr]
enabled = true

[extraction.ocr.backend]
kind = "noop"

# To use the externalised OCR Bento (once the contract finalises),
# replace the block above with:
#
#   [extraction.ocr.backend]
#   kind = "bento"
#   base_url = "http://localhost:3001"

# Speech-to-text transcription.
[extraction.stt]
enabled = true

[extraction.stt.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "whisper-1"

[extraction.stt.agent]
model = "whisper-1"
max_retries = 3

# VLM verifier — runs an LLM pass over OCR-detected entities to
# confirm/correct them against the source image. Dispatched after
# [extraction.ocr] when workflow extraction.visual.verification is set.
[extraction.vlm]
enabled = true

[extraction.vlm.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "gpt-4o"

[extraction.vlm.agent]
temperature = 0.0
max_tokens = 1024
max_retries = 3

# Detection recognizer registry.
#
# Each opted-in `[detection.*]` section is built once at server
# startup. Set `enabled = false` to keep the config but skip
# construction and dispatch. Workflows enable recognizers by name
# via `detection.kinds = ["llm", "nlp", "pattern"]` — recognizer-side
# configuration lives here, never in the workflow.

# LLM-backed recognizer.
[detection.llm]
enabled = true
verify_pass = true # adds a second LLM call per span
unresolved_policy = "drop" # drop | warn | error

[detection.llm.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "gpt-4o"

[detection.llm.agent]
temperature = 0.1
max_tokens = 4096
max_retries = 3

# NER recognizer (named-entity recognition + language detection).
#
# Backend selection lives under `[detection.ner.backend]`. Two
# backends ship today:
#
#   kind = "noop"
#     Produces zero entities. The default. Use this when detection
#     happens via patterns / LLM only.
#
#   kind = "bento"
#     Calls the externalised `inference-gliner` Bento at `base_url`.
#     Requires the runtime to be built with the `bento` feature
#     (on by default in the `nvisy-cli` binary). Pair with the
#     service in https://github.com/nvisycom/inference — see the
#     repo's `docker-compose.yml` for a self-contained example.
[detection.ner]
enabled = true

[detection.ner.backend]
kind = "noop"

# To use the externalised GLiNER service, replace the block above
# with:
#
#   [detection.ner.backend]
#   kind = "bento"
#   base_url = "http://localhost:3000"

# Pattern-based recognizer (regex + dictionary + checksum).
[detection.pattern]
enabled = true
patterns = [] # empty = all built-in patterns
confidence_threshold = 0.5

# Redaction defaults + audio redaction codec.
#
# Pipeline `Redaction` steps fall back to these for any field
# they leave unset. Per-request overrides are honored (cheap config,
# no expensive construction).
[redaction]
confidence_threshold = 0.5
process_metadata = false

# TTS provider for audio redaction codec — synthesizes replacement
# audio for redacted spans in audio documents. Omit the section
# entirely to fall back to non-TTS audio replacement (silence/beep).
[redaction.tts]
enabled = true

[redaction.tts.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "tts-1"

[redaction.tts.agent]
model = "tts-1"
voice = "alloy"
speed = 1.0
max_retries = 3
