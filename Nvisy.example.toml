# Nvisy configuration
#
# Copy to Nvisy.toml (or run `make generate-config`), then edit as needed.
# The server loads Nvisy.toml by default; override with --config or NVISY_CONFIG.
#
# All sections are optional — omitted sections use runtime defaults.
# Per-request overrides (in the JSON request body) replace entire
# [engine] sections; `[extractor.*]` and `[recognizer.*]` are built
# once at startup and shared across runs (overrides would force model
# reloads and defeat the amortization).

version = "0.1.0"

# Server binding and storage.
# CLI flags (--host, --port, --data-dir) override these.
[server]
host = "0.0.0.0"
port = 8080
shutdown_timeout = 30
data_dir = "./data"

[server.observability]
level = "info"               # any tracing_subscriber filter directive
format = "json"              # json | text

[server.middleware]
body_limit_mb = 4
request_timeout_secs = 300
cors = { allowed_origins = ["*"], max_age_secs = 3600 }

# Default retry and timeout policies applied to every graph node.
[engine]
retry = { max_retries = 3, delay_ms = 500, backoff = "fixed" }
timeout = { duration_ms = 30000, on_timeout = "fail" }
concurrency = { maxNodes = 4 }

# Run-level resource limits.
[engine.limits]
run_timeout_ms = 60000
max_nodes = 50
max_envelope_size_bytes = 104857600  # 100 MB

# Shared HTTP client for all downstream provider calls.
[engine.http]
max_retries = 3
timeout_secs = 120
connect_timeout_secs = 10
idle_timeout_secs = 90

# Extractor registry.
#
# Each opted-in `[extractor.*]` section is built once at server
# startup. Set `enabled = false` to keep the config but skip
# construction and dispatch. Workflow `Extraction` nodes carry
# per-call flags only.

# OCR text extraction from image documents.
[extractor.ocr]
enabled = true

[extractor.ocr.provider]
kind = "paddle-x"
base_url = "http://localhost:8003"

[extractor.ocr.policy]
confidence_threshold = 0.5

# Speech-to-text transcription.
[extractor.stt]
enabled = true

[extractor.stt.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "whisper-1"

[extractor.stt.agent]
model = "whisper-1"
max_retries = 3

# VLM verifier — runs an LLM pass over OCR-detected entities to
# confirm/correct them against the source image. Dispatched after
# [extractor.ocr] when workflow extraction.visual.verification is set.
[extractor.vlm]
enabled = true

[extractor.vlm.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "gpt-4o"

[extractor.vlm.agent]
temperature = 0.0
max_tokens = 1024

# Detection recognizer registry.
#
# Each opted-in `[recognizer.*]` section is built once at server
# startup. Set `enabled = false` to keep the config but skip
# construction and dispatch. Workflows enable recognizers by name
# via `detection.kinds = ["llm", "nlp", "pattern"]` — recognizer-side
# configuration lives here, never in the workflow.

# LLM-backed recognizer.
[recognizer.llm]
enabled = true
verify_pass = true # adds a second LLM call per span
unresolved_policy = "drop" # drop | warn | error

[recognizer.llm.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "gpt-4o"

[recognizer.llm.agent]
temperature = 0.1
max_tokens = 4096

# NLP-engine recognizer (NER + language detection + tokenizer).
[recognizer.nlp]
enabled = true
engine = "default"

# Pattern-based recognizer (regex + dictionary + checksum).
[recognizer.pattern]
enabled = true
patterns = [] # empty = all built-in patterns
confidence_threshold = 0.5

# Redaction defaults + audio redaction codec.
#
# Workflow `Redaction` nodes fall back to these for any field
# they leave unset. Per-request overrides are honored (cheap config,
# no expensive construction).
[redactor]
confidence_threshold = 0.5
process_metadata = false

# TTS provider for audio redaction codec — synthesizes replacement
# audio for redacted spans in audio documents. Omit the section
# entirely to fall back to non-TTS audio replacement (silence/beep).
[redactor.tts]
enabled = true

[redactor.tts.provider]
kind = "open-ai"
api_key = "sk-example-replace-me"
model = "tts-1"

[redactor.tts.agent]
model = "tts-1"
voice = "alloy"
speed = 1.0
max_retries = 3
