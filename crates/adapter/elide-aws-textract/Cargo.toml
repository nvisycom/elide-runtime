# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-aws-textract"
description = "AWS Textract-backed OCR backend for the elide toolkit"
keywords = ["elide", "aws", "textract", "ocr", "document"]
categories = ["api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide-core = { workspace = true, features = [] }
elide-image = { workspace = true, features = ["ocr"] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }

# OCR provider
aws-sdk-textract = { workspace = true }
