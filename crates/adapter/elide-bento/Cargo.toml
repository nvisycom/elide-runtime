# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-bento"
description = "BentoML-backed NER, OCR, and STT backends for the elide toolkit"
keywords = ["elide", "bento", "bentoml", "ner", "ocr"]
categories = ["api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["ner", "ocr", "stt"]
## Ship the NER backend (implements `elide_ner::backend::NerBackend`
## against the `elide-bento-ner` BentoML service).
ner = ["dep:elide-ner"]
## Ship the OCR backend (implements `elide_ocr::OcrBackend`
## against the `elide-bento-ocr` BentoML service).
ocr = ["dep:elide-ocr", "dep:base64", "elide-core/image"]
## Ship the STT backend (implements `elide_stt::backend::SttBackend`
## against the `elide-bento-stt` BentoML service).
stt = ["dep:elide-stt", "dep:base64", "elide-core/audio"]
## Report the encoder tokens a NER call spent on the `NerResponse`, from the
## `tokens` the service returns. Off by default, matching elide's own `usage`
## gate: a consumer that does not read usage pays nothing.
usage = ["ner", "elide-ner/usage", "elide-core/usage"]

[dependencies]
# Elide crates
elide-core = { workspace = true, features = [] }
elide-ner = { workspace = true, features = [], optional = true }
elide-ocr = { workspace = true, features = [], optional = true }
elide-stt = { workspace = true, features = [], optional = true }

# Serialization
serde = { workspace = true, features = ["derive"] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }

# Encoding and hashing
base64 = { workspace = true, features = [], optional = true }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }

# AI / LLM frameworks
bentoml = { workspace = true, default-features = false, features = ["rustls-tls", "tracing"] }

[dev-dependencies]
# Serialization
serde_json = { workspace = true, features = ["std"] }

# Async runtime and parallelism
tokio = { workspace = true, features = ["rt", "macros"] }
