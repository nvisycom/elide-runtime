# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-gladia"
description = "Gladia-backed speech-to-text backend for the elide toolkit"
keywords = ["elide", "gladia", "stt", "transcription", "diarization"]
categories = ["api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide-core = { workspace = true, features = ["audio"] }
elide-stt = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }

# Speech-to-text provider
gladia = { workspace = true }

