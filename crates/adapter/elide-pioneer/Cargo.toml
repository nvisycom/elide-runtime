# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-pioneer"
description = "Pioneer (Fastino) GLiNER2-backed NER backend for the elide toolkit"
keywords = ["elide", "pioneer", "fastino", "gliner", "ner"]
categories = ["api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide-core = { workspace = true, features = [] }
elide-ner = { workspace = true, features = [] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }

# HTTP: Pioneer publishes no Rust SDK.
reqwest = { workspace = true }
