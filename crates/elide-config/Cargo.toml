# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-config"
description = "Deployment configuration for the Elide Runtime engine: backends, credentials, and key providers"
keywords = ["elide", "config", "deployment", "engine"]
categories = ["config"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Turn on the test-only mock backends, forwarding to the pipeline's
## own gate so a config cannot name a mock in a release build.
test-utils = ["elide-pipeline/test-utils"]

[dev-dependencies]
serde_json = { workspace = true, features = [] }

[dependencies]
# Elide crates
elide = { workspace = true, features = ["hmac", "aes"] }

# Internal crates
elide-pipeline = { workspace = true, features = [] }

# Serialization
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = [] }
