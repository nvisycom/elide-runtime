# A component with every limit set: 60 calls a minute, bursting to
# 10, at most 4 calls in flight, and batches split at 32.

[[recognizers.ner]]
name = "limited-ner"
kind = "bento"
base_url = "https://ner.internal"
model = "m"

[recognizers.ner.rateLimit]
requests = 60
burst = 10
maxConcurrent = 4
maxBatchSize = 32
