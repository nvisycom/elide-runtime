# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-governance"
description = "Wire schema for redaction governance built on elide: rules, predicates, operators"
keywords = ["elide", "schema", "policy", "redaction", "governance"]
categories = ["data-structures", "api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide-core = { workspace = true, features = ["serde", "schema", "audio"] }
elide-operator = { workspace = true, features = ["serde", "schema", "datetime", "sha2"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["uuid1"] }

# Derive macros and error handling
strum = { workspace = true, features = ["derive"] }

# Version metadata on template provenance
semver = { workspace = true, features = ["serde"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v7"] }
hipstr = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Wire round-trip assertions for the serde derives above.
serde_json = { workspace = true }
