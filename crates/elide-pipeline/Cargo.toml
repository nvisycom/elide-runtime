# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-pipeline"
description = "Stateless document pipeline on top of elide: analyzer + anonymizer + orchestrator"
keywords = ["elide", "pipeline", "engine", "redaction"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["all-modalities"]

## Every codec this crate ships, across all four modalities. The
## modalities themselves are unconditional, so this toggles only
## the container and per-modality codecs.
##
## Deliberately excludes `codec-mp3` (MP3 patent licensing may not
## be satisfiable downstream) and `codec-pdf-render` (drags in a
## native rendering dep). Both stay opt-in: a caller asking for
## every modality should not silently take on either.
all-modalities = ["tabular", "image", "audio", "document"]

## Every tabular codec elide ships (CSV, XLSX). The tabular
## modality itself is always compiled in.
tabular = ["codec-csv", "codec-xlsx"]
## Every image codec elide ships (PNG, JPEG, TIFF). The image
## modality itself is always compiled in.
image = ["codec-png", "codec-jpeg", "codec-tiff"]
## The WAV codec. MP3 is opt-in via `codec-mp3` because of patent
## licensing. The audio modality itself is always compiled in.
audio = ["codec-wav"]
## Container-document codecs: DOCX, PDF, RTF. Standalone: text and
## image modalities are still needed to handle the parts these
## containers embed. `codec-pdf-render` (rasterising pages for
## OCR) is opt-in via its own toggle.
document = ["codec-docx", "codec-pdf", "codec-rtf"]

## Individual codec toggles. Every modality's analyzer,
## anonymizer, and redaction operators are always compiled in, so
## each of these adds only the codec itself.
codec-csv = ["elide/codec-csv"]
codec-xlsx = ["elide/codec-xlsx"]
codec-png = ["elide/codec-png"]
codec-jpeg = ["elide/codec-jpeg"]
codec-tiff = ["elide/codec-tiff"]
codec-wav = ["elide/codec-wav"]
## MP3 is opt-in: MP3 patent licensing may not be satisfiable
## downstream. Off by default even when `audio` is enabled.
codec-mp3 = ["elide/codec-mp3"]
## DOCX documents (a zip archive with an XML body plus embedded
## image parts).
codec-docx = ["elide/codec-docx"]
## PDF documents (text extraction).
codec-pdf = ["elide/codec-pdf"]
## PDF page rasterisation for downstream OCR. Standalone toggle
## on top of `codec-pdf`; opt-in because it drags in a native
## rendering dep.
codec-pdf-render = ["codec-pdf", "elide/codec-pdf-render"]
## RTF documents.
codec-rtf = ["elide/codec-rtf"]

## JSON audit export via `elide_export::ExportJson`.
audit-json = ["dep:elide-export", "elide-export/json"]
## CSV audit export via `elide_export::ExportCsv`. Pulls
## `serde_json` for reading enum-tagged operator kinds off
## reviewer overrides.
audit-csv = ["dep:elide-export", "elide-export/csv", "dep:serde_json"]
## Bundle every audit CSV table into one zip archive via
## `elide_export::ExportCsv::write_zip`.
audit-zip = ["audit-csv", "elide-export/zip"]

## Ship the Gladia-backed STT backend, so a deployment can
## transcribe through Gladia's hosted API instead of a self-hosted
## service. Off by default: it pulls a third-party HTTP client, and
## it sends audio off your infrastructure before redaction runs.
gladia = ["elide-provider/gladia"]

## Turn on the test-only mock variants
## (`{Ner,Ocr,Stt,Llm}BackendConfig::Mock`) and the elide mock
## backends they compile into. Off in production so deployment
## config cannot ship a mock recognizer.
test-utils = [
    "elide/test-utils",
    "elide-provider/test-utils",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide = { workspace = true, features = ["engine", "codec", "codec-text", "tabular", "image", "audio", "serde", "schema", "usage"] }

# Internal crates
elide-export = { workspace = true, features = [], optional = true }
elide-governance = { workspace = true, features = [] }
elide-provider = { workspace = true, features = [] }
elide-review = { workspace = true, features = [] }
elide-template = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde-value = { workspace = true, features = [] }
serde_json = { workspace = true, features = [], optional = true }
schemars = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = ["serde"] }
jiff = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Internal crates

elide-export = { workspace = true, features = ["json", "csv", "zip"] }
elide-pipeline = { path = ".", features = ["test-utils", "audit-json", "audit-csv", "audit-zip"] }

# Serialization
serde_json = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }
uuid = { workspace = true, features = ["v7"] }

# Test utilities
zip = { workspace = true }

# Async runtime and parallelism
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Benchmarking
criterion = { workspace = true }
elide-template = { workspace = true }

[[bench]]
name = "engine"
harness = false
