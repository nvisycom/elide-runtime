# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-provider"
description = "Deployment-configured recognition and redaction providers for the Elide Runtime"
keywords = ["elide", "provider", "config", "deployment"]
categories = ["config", "text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Turn on the test-only mock backends and the elide mock backends
## they compile into. Off in production so deployment config
## cannot name a mock recognizer.
mocks = ["elide/mocks", "elide-deployment/mocks"]

## Ship the Deepgram-backed STT backend, so a deployment can transcribe
## through Deepgram's hosted API instead of a self-hosted service. Off by
## default: it pulls a third-party HTTP client, and it sends audio off
## your infrastructure. See `SttBackend::Deepgram`.
deepgram = ["elide-deployment/deepgram", "dep:elide-deepgram"]

## Ship Pioneer's hosted GLiNER service as a NER backend. Off by
## default: it sends document text to a third party, and Pioneer's
## zero-retention option is a request rather than a guarantee. See
## `NerBackend::Pioneer`.
pioneer = ["elide-deployment/pioneer", "dep:elide-pioneer-gliner"]

## Ship Google Cloud Document AI as an OCR backend. Off by default,
## Building its client is async, so a deployment
## naming it is built through `Provider::try_new`.
google-document-ai = [
    "elide-deployment/google-document-ai",
    "dep:elide-google-document-ai",
]

[package.metadata.cargo-machete]
# Depended on for its features, not its API: enabling
# `openai-gpt`/`anthropic-claude`/`google-gemini` is what makes the
# matching `Provider` variants exist, and this crate names those
# through the `elide` facade. Dropping the dependency removes the
# variants and fails to compile, so it is used — just not imported.
ignored = ["elide-llm"]

[dependencies]
# Elide crates
elide = { workspace = true, features = ["codec", "engine", "tabular", "image", "audio", "pattern", "ner", "ocr", "stt", "llm", "llm-rig", "lingua", "operator-fake", "serde", "schema", "operator-sha2", "operator-hmac", "operator-aes", "operator-datetime", "metrics", "ratelimit"] }

# Elide extensions

elide-bentoml = { workspace = true, features = ["ner", "ocr", "stt"] }
elide-deepgram = { workspace = true, optional = true }
elide-google-document-ai = { workspace = true, features = [], optional = true }
elide-pioneer-gliner = { workspace = true, features = [], optional = true }

# Internal crates
elide-llm = { workspace = true, features = ["rig", "openai-gpt", "anthropic-claude", "google-gemini"] }
elide-image = { workspace = true, features = ["schema", "exif"] }
elide-pdf = { workspace = true, features = ["schema"] }
elide-deployment = { workspace = true, features = [] }
elide-schema = { workspace = true, features = [] }

# Serialization
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

[dev-dependencies]
# Benchmarking
criterion = { workspace = true }
elide-template = { workspace = true }

# Async runtime, for the tests that exercise `Provider::try_new`.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Self, with the mock backends on
elide-provider = { path = ".", features = ["mocks"] }

# Serialization
serde_json = { workspace = true, features = [] }

[[bench]]
name = "compile"
harness = false
