# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-review"
description = "Reviewer edits over an elide report: add, retag, suppress, override"
keywords = ["elide", "review", "redaction", "audit", "schema"]
categories = ["data-structures", "api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide = { workspace = true, features = ["engine", "tabular", "image", "audio", "serde", "schema"] }

# Internal crates
elide-governance = { workspace = true, features = [] }

# Serialization
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

[dev-dependencies]
# Serialization
serde_json = { workspace = true, features = [] }
