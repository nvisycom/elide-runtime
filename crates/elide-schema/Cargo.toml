# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-schema"
description = "Wire schema for redaction governance built on elide: rules, predicates, operators"
keywords = ["elide", "schema", "policy", "redaction", "governance"]
categories = ["data-structures", "api-bindings"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide = { workspace = true, features = ["serde", "schema", "audio", "image", "tabular", "operator-datetime", "operator-sha2"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["uuid1"] }

# Version metadata on template provenance
semver = { workspace = true, features = ["serde"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v7"] }
hipstr = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Wire round-trip assertions for the serde derives above.
serde_json = { workspace = true }
