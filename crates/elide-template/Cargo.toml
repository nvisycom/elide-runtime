# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "elide-template"
description = "Ready-to-run policy templates on top of elide for common regulatory postures (HIPAA, GDPR, PCI DSS, CCPA, SOC 2)"
keywords = ["elide", "policy", "template", "hipaa", "gdpr"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide-core = { workspace = true, features = ["serde"] }
elide-operator = { workspace = true, features = ["datetime", "sha2"] }

# Internal crates
elide-governance = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = ["serde"] }
jiff = { workspace = true, features = ["serde"] }
semver = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
# Serialization
serde_json = { workspace = true, features = [] }
