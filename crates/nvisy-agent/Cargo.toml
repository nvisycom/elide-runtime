# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-agent"
description = "LLM agents (NER, VLM, STT, OCR-verifier) over the rig framework for the Nvisy runtime"
keywords = ["nvisy", "rig", "llm", "ner", "agent"]
categories = ["text-processing", "api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enable OpenAI GPT completion provider.
openai-gpt = []
## Enable OpenAI Whisper speech-to-text provider.
openai-whisper = []
## Enable Anthropic Claude completion provider.
anthropic-claude = []
## Enable Google Gemini completion provider.
google-gemini = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# LLM framework
rig = { workspace = true, features = ["derive", "reqwest-middleware", "audio"] }

# Async runtime
async-trait = { workspace = true, features = [] }

# HTTP client + middleware (shared retry/tracing layers).
reqwest-middleware = { workspace = true, features = [] }
reqwest-retry = { workspace = true, features = [] }
reqwest-tracing = { workspace = true, features = [] }
humantime-serde = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }
toml = { workspace = true, features = ["parse"] }
minijinja = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

# Encoding and hashing
base64 = { workspace = true, features = [] }
unicode-normalization = { workspace = true, features = [] }

# Derive macros and error handling
derive_builder = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["add_assign"] }
thiserror = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
