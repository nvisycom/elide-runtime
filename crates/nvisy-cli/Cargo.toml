# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-cli"
description = "CLI entry point for the nvisy API server"
keywords = ["nvisy", "cli", "server"]
categories = ["command-line-utilities"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["openai", "anthropic", "google", "microsoft", "amazon"]

## Enable all OpenAI providers (GPT, Whisper STT, TTS).
openai = ["nvisy-server/openai"]
## Enable Anthropic Claude completion provider.
anthropic = ["nvisy-server/anthropic"]
## Enable Google Gemini + Google Cloud Vision OCR.
google = ["nvisy-server/google"]
## Enable Azure Document Intelligence OCR.
microsoft = ["nvisy-server/microsoft"]
## Enable AWS Textract OCR.
amazon = ["nvisy-server/amazon"]

## Enable the ONNX-backed BIO-tagging NER backend.
onnx = ["nvisy-server/onnx"]
## Enable the zero-shot GLiNER NER backend.
gliner = ["nvisy-server/gliner"]
## Enable HuggingFace Hub auto-download for NLP preset artifacts.
hf = ["nvisy-server/hf"]

## CoreML execution provider — macOS / Apple Silicon.
coreml = ["nvisy-server/coreml"]
## CUDA execution provider — NVIDIA GPUs.
cuda = ["nvisy-server/cuda"]
## TensorRT execution provider — NVIDIA inference optimization.
tensorrt = ["nvisy-server/tensorrt"]
## DirectML execution provider — Windows GPU compute.
directml = ["nvisy-server/directml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "nvisy-server"
path = "src/main.rs"

[dependencies]
# Internal crates
nvisy-engine = { workspace = true, features = [] }
nvisy-server = { workspace = true, features = [] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# (De)serialization
serde = { workspace = true, features = [] }
toml = { workspace = true, features = [] }
humantime-serde = { workspace = true, features = [] }

# Derive macros and error handling
anyhow = { workspace = true, features = [] }

# HTTP server
axum = { workspace = true, features = ["tokio"] }

# Async runtime and parallelism
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# Observability
tracing = { workspace = true, features = [] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
