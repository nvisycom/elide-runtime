# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-cli"
description = "CLI entry point for the nvisy API server"
keywords = ["nvisy", "cli", "server"]
categories = ["command-line-utilities"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["openai", "anthropic", "google", "microsoft", "amazon"]

## Enable all OpenAI providers (GPT, Whisper STT, TTS).
openai = ["nvisy-server/openai"]
## Enable Anthropic Claude completion provider.
anthropic = ["nvisy-server/anthropic"]
## Enable Google Gemini + Google Cloud Vision OCR.
google = ["nvisy-server/google"]
## Enable Azure Document Intelligence OCR.
microsoft = ["nvisy-server/microsoft"]
## Enable AWS Textract OCR.
amazon = ["nvisy-server/amazon"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "nvisy-server"
path = "src/main.rs"

[dependencies]
# Internal crates
nvisy-registry = { workspace = true, features = [] }
nvisy-server = { workspace = true, features = [] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# Derive macros and error handling
anyhow = { workspace = true, features = [] }

# HTTP server
axum = { workspace = true, features = ["tokio"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# Observability
tracing = { workspace = true, features = [] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
