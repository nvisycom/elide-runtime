# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-cli"
description = "CLI entry point for the nvisy API server"
keywords = ["nvisy", "cli", "server"]
categories = ["command-line-utilities"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["tabular", "image", "audio", "document"]

## Tabular modality — csv, xlsx.
tabular = ["nvisy-server/tabular"]
## Image modality — png, jpeg, tiff.
image = ["nvisy-server/image"]
## Audio modality — wav, mp3.
audio = ["nvisy-server/audio"]
## Document containers — docx
document = ["nvisy-server/document"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "nvisy"
path = "src/main.rs"

[dependencies]
# Internal crates
nvisy-server = { workspace = true, features = [] }

# Error handling for the boot path.
anyhow = { workspace = true, features = [] }

# TOML file loading.
toml = { workspace = true, features = [] }

# Human-readable duration parsing for CLI args
# (`--shutdown-timeout "30s"`).
humantime = { workspace = true, features = [] }

# Async runtime and parallelism
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# Observability
tracing = { workspace = true, features = [] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# HTTP server and middleware
axum = { workspace = true, features = ["tokio"] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }
