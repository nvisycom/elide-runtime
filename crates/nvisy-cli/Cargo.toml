# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-cli"
description = "CLI entry point for the nvisy API server"
keywords = ["nvisy", "cli", "server"]
categories = ["command-line-utilities"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = [
    "tabular", "image", "audio", "rich",
    "openai", "anthropic", "google",
    "bento",
]

## Tabular modality — csv, xlsx.
tabular = ["nvisy-server/tabular"]
## Image modality — png, jpeg, tiff.
image = ["nvisy-server/image"]
## Audio modality — wav, mp3.
audio = ["nvisy-server/audio"]
## Rich-document modality — pdf, docx.
rich = ["nvisy-server/rich"]

## Enable all OpenAI providers (GPT, Whisper STT).
openai = ["nvisy-server/openai"]
## Enable Anthropic Claude completion provider.
anthropic = ["nvisy-server/anthropic"]
## Enable Google Gemini.
google = ["nvisy-server/google"]

## Enable the externalized BentoML backends (NER + OCR) — forwards
## to `nvisy-server/bento`.
bento = ["nvisy-server/bento"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "nvisy"
path = "src/main.rs"

[dependencies]
# Internal crates
nvisy-engine = { workspace = true, features = [] }
nvisy-server = { workspace = true, features = [] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# (De)serialization
serde = { workspace = true, features = [] }
toml = { workspace = true, features = [] }
humantime-serde = { workspace = true, features = [] }

# Derive macros and error handling
anyhow = { workspace = true, features = [] }

# HTTP server
axum = { workspace = true, features = ["tokio"] }

# Async runtime and parallelism
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# Observability
tracing = { workspace = true, features = [] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
