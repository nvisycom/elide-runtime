# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-codec"
description = "Modality-keyed traits and infrastructure for document handlers in the Nvisy multimodal redaction platform"
keywords = ["nvisy", "codec", "traits", "redaction"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["text", "tabular"]

## Text-handler trait, TextData, TextRedaction, apply_text_redaction.
text = []
## Tabular-handler trait, TabularRedaction, apply_tabular_redaction.
## Pulls in text infra for TextData (cell values are textual).
tabular = ["text"]
## Image-handler trait, ImageData, ImageRedaction, apply_image_redaction.
## Pulls the `image` + `imageproc` crates.
image = ["dep:image", "dep:imageproc"]
## Audio-handler trait, AudioData, AudioRedaction, apply_audio_redaction.
audio = []
## Rich-document handler trait (multi-modal containers like PDF / DOCX).
## Requires both text and image since rich documents expose both.
rich = ["text", "image"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["sync"] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
uuid = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# Derive macros and error handling
derive_more = { workspace = true, features = ["as_ref", "deref", "deref_mut", "display", "from", "into_iterator"] }
thiserror = { workspace = true, features = [] }

# Image processing (feature-gated)
image = { workspace = true, optional = true, features = [] }
imageproc = { workspace = true, optional = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
