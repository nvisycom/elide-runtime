# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-codec"
description = "Modality-keyed traits and infrastructure for document handlers in the Nvisy multimodal redaction platform"
keywords = ["nvisy", "codec", "traits", "redaction"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["text", "tabular"]

## Text modality wire types: enables the `Codable for Text` impl.
text = []
## Tabular modality wire types: enables the `Codable for Tabular`
## impl. Pulls in `text` because tabular cells are textual.
tabular = ["text"]
## Image modality wire types: enables the `Codable for Image` impl.
image = []
## Audio modality wire types: enables the `Codable for Audio` impl
## and the `sort_redactions_for_audio` helper.
audio = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Async runtime
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
