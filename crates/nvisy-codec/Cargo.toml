# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-codec"
description = "File-format codecs — read, edit, and write documents for the Nvisy multimodal redaction platform"
keywords = ["nvisy", "codec", "loader", "pdf", "docx"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["pdf", "docx", "html", "xlsx"]

## PDF parsing, text extraction, and page-to-image rendering.
pdf = ["dep:lopdf", "dep:pdfium-render", "dep:rayon"]
## Microsoft Word (.docx) parsing via zip + quick-xml.
docx = ["dep:zip", "dep:quick-xml"]
## HTML parsing and text extraction via scraper.
html = ["dep:scraper"]
## Excel (.xlsx) spreadsheet parsing via calamine.
xlsx = ["dep:calamine"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["sync"] }

# (De)serialization
csv = { workspace = true, features = [] }
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
uuid = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# Derive macros and error handling
derive_more = { workspace = true, features = ["as_ref", "deref", "deref_mut", "display", "from"] }

# Image processing
image = { workspace = true, features = [] }
imageproc = { workspace = true, features = [] }

# PDF processing (feature-gated)
lopdf = { workspace = true, optional = true, features = [] }
pdfium-render = { workspace = true, optional = true, features = [] }
rayon = { workspace = true, optional = true, features = [] }

# Document parsing (feature-gated)
calamine = { workspace = true, optional = true, features = [] }
quick-xml = { workspace = true, optional = true, features = [] }
scraper = { workspace = true, optional = true, features = [] }
zip = { workspace = true, optional = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
