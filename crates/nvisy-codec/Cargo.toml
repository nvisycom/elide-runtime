# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-codec"
description = "Modality-keyed traits and infrastructure for document handlers in the Nvisy multimodal redaction platform"
keywords = ["nvisy", "codec", "traits", "redaction"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["text", "tabular"]

## Text modality wire types: TextData, TextOutput, TextRedaction.
text = []
## Tabular modality wire types: TabularRedaction.
## Pulls in text infra for TextData (cell values are textual).
tabular = ["text"]
## Image modality wire types: ImageData, ImageOutput, ImageRedaction.
## Pulls the `image` crate for `DynamicImage`.
image = ["dep:image"]
## Audio modality wire types: AudioData, AudioOutput, AudioRedaction.
audio = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
uuid = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# Derive macros and error handling
derive_more = { workspace = true, features = ["as_ref", "deref", "deref_mut", "display", "from", "into", "into_iterator"] }
thiserror = { workspace = true, features = [] }

# Image processing (feature-gated) — `DynamicImage` is referenced by
# the image handler's wire types; the per-region pixel ops live in
# `nvisy-formats` and pull `imageproc` themselves.
image = { workspace = true, optional = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
