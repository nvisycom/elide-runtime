# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-core"
description = "Domain types, traits, and errors for the Nvisy platform"
keywords = ["nvisy", "core", "domain", "types"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-ontology = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }
jiff = { workspace = true, features = [] }
semver = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# File type detection
infer = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["as_ref", "deref", "display"] }
strum = { workspace = true, features = [] }

# Encoding and hashing
sha2 = { workspace = true, features = [] }
hex = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tempfile = { workspace = true, features = [] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
