# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-core"
description = "Runtime plumbing for the Nvisy platform: LLM deployment config, healthcheck traits, and the shared error vocabulary"
keywords = ["nvisy", "core", "runtime"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Turn on the `LlmBackendConfig::Mock` and `NerBackendConfig::Mock`
## variants. Off in production so `Nvisy.toml` cannot ship a mock
## backend for either.
test-utils = []

[dependencies]
# Elide crates
elide-core = { workspace = true, features = [] }
elide-llm = { workspace = true, features = ["rig", "openai-gpt", "anthropic-claude", "google-gemini"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["display"] }
derive_builder = { workspace = true, features = [] }
strum = { workspace = true, features = ["derive"] }
