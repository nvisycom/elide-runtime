# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-core"
description = "Domain types, traits, and errors for the Nvisy platform"
keywords = ["nvisy", "core", "domain", "types"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

## Test utilities (Entity::new_test, fixture helpers, …).
test-utils = []

# Shared HTTP client (reqwest + retry + tracing middleware), exposed
# under `nvisy_core::http`. Enabled by any crate that makes outbound
# HTTP calls (LLM agents, OCR providers, ...).
http = [
    "dep:reqwest-middleware",
    "dep:reqwest-retry",
    "dep:reqwest-tracing",
    "dep:humantime-serde",
]

[dependencies]
# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }
humantime-serde = { workspace = true, features = [], optional = true }

# Primitive datatypes
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }
uuid = { workspace = true, features = [] }
jiff = { workspace = true, features = [] }
oxilangtag = { workspace = true, features = [] }
type-map = { workspace = true, features = [] }

# File type detection
infer = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_builder = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["as_ref", "deref", "deref_mut", "display", "from", "from_str", "into", "into_iterator", "is_variant"] }
strum = { workspace = true, features = [] }

# Async trait sugar (object-safe async methods)
async-trait = { workspace = true, features = [] }

# Encoding and hashing
sha2 = { workspace = true, features = [] }
hex = { workspace = true, features = [] }

# HTTP client (optional; enabled by the `http` feature)
reqwest-middleware = { workspace = true, features = [], optional = true }
reqwest-retry = { workspace = true, features = [], optional = true }
reqwest-tracing = { workspace = true, features = [], optional = true }

# Observability
tracing = { workspace = true, features = [] }

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
