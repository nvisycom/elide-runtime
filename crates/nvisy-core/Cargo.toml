# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-core"
description = "Domain types, traits, errors, and plugin registry for the Nvisy platform"
keywords = ["nvisy", "core", "domain", "types"]
categories = ["data-structures"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
bytes = { workspace = true, features = ["serde"] }

# File type detection
infer = { workspace = true, features = [] }

# Error handling
thiserror = { workspace = true, features = [] }
anyhow = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }
