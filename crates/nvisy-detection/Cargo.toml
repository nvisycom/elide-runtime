# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-detection"
description = "Entity ontology types and detection layers for Nvisy"
keywords = ["nvisy", "detection", "entity", "ontology"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-codec = { workspace = true, features = [] }
nvisy-pattern = { workspace = true, features = [] }
nvisy-python = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }

# Derive macros
derive_more = { workspace = true, features = ["from"] }

# Enum utilities
strum = { workspace = true, features = ["derive"] }

# JSON Schema generation
schemars = { workspace = true, features = [] }

# Text processing
regex = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
regex = { workspace = true, features = [] }
