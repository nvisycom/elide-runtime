# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-engine"
description = "Runtime adapter over elide: Policy compile, multi-tenant registry, request orchestration"
keywords = ["nvisy", "engine", "elide", "redaction"]
categories = ["data-structures", "concurrency"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = true

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["tabular", "image", "audio"]

tabular = ["elide/codec-tabular"]
image = ["elide/codec-image"]
audio = ["elide/codec-audio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Elide toolkit (upstream). `mock` pulls the no-op NER/LLM backends
# the analyzer compile uses for `NerBackendParams::Mock` /
# `LlmBackendParams::Mock`; real LLM providers land when key-provider
# wiring lands.
elide = { workspace = true, features = ["codec", "codec-text", "pattern", "ner", "llm", "mock", "serde", "sha2"] }
elide-core = { workspace = true, features = ["serde", "image", "audio", "tabular"] }

# Recognition-side elide crates not re-exported through the elide
# umbrella the way the recognizer crates are (`elide::recognition::*`
# is the natural reach for those). `elide-ocr` is the OCR enricher
# layer engine wires from the image-modality compile path.
elide-ocr = { workspace = true, features = ["mock"] }
elide-stt = { workspace = true, features = ["mock"] }

# Runtime-owned elide extensions
elide-bento = { workspace = true, features = ["ner", "ocr"] }

# Derive macros
derive_more = { workspace = true, features = ["as_ref", "deref", "from"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v7"] }
semver = { workspace = true, features = ["serde"] }
hipstr = { workspace = true, features = ["serde"] }
jiff = { workspace = true, features = ["serde"] }
bytes = { workspace = true, features = [] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true, features = [] }

# Async runtime — `time` powers the per-doc timeout wrapping the
# analyze fan-out. We do **not** depend on `rt`/`spawn`-style
# concurrency: the engine drives concurrent analyzes via
# `futures::stream::buffer_unordered` so the surrounding borrows
# of the codec registry + analyzer spec can stay non-`'static`.
tokio = { workspace = true, features = ["macros", "time"] }

# Concurrent stream combinators for the analyze fan-out.
# `stream::iter(...).buffer_unordered(N)` is the engine's
# non-spawn concurrency primitive — caps in-flight work at N
# while keeping every per-doc future borrowing the codec
# registry + spec for free.
futures = { workspace = true, features = ["std"] }

# Multi-tenant storage
fjall = { workspace = true, features = [] }

# Resource serialisation (policy / context / run blobs in fjall)
serde_json = { workspace = true, features = [] }
