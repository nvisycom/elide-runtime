# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-engine"
description = "DAG compiler and executor for Nvisy pipeline graphs"
keywords = ["nvisy", "engine", "dag", "pipeline"]
categories = ["concurrency"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["tabular", "image", "audio", "rich"]
## Test utilities (Engine::temp, etc.).
test-utils = ["dep:tempfile"]

## Tabular modality — csv, xlsx. Defaults on.
tabular = ["nvisy-codec/tabular", "nvisy-formats/tabular"]
## Image modality — png, jpeg, tiff. Defaults on.
image = ["nvisy-codec/image", "nvisy-formats/image"]
## Audio modality — wav, mp3. Defaults on.
audio = ["nvisy-codec/audio", "nvisy-formats/audio"]
## Rich-document modality — pdf, docx. Pulls `image` because
## codec's `ContentHandle::Rich` arm carries a handler that
## implements both text and image capabilities, so engine's source
## must also compile its image arm when rich is on. Defaults on.
rich = ["image", "nvisy-codec/rich", "nvisy-formats/rich"]

## Enable all OpenAI providers (GPT, Whisper STT, TTS).
openai = ["nvisy-agent/openai-gpt", "nvisy-agent/openai-whisper", "nvisy-agent/openai-tts"]
## Enable Anthropic Claude completion provider.
anthropic = ["nvisy-agent/anthropic-claude"]
## Enable Google Gemini + Google Cloud Vision OCR.
google = ["nvisy-agent/google-gemini", "nvisy-ocr/google-vision"]
## Enable Azure Document Intelligence OCR.
microsoft = ["nvisy-ocr/azure-docai"]
## Enable AWS Textract OCR.
amazon = ["nvisy-ocr/aws-textract"]

## Enable the externalized GLiNER NER backend (forwards to
## `nvisy-nlp/bento`).
bento = ["nvisy-nlp/bento"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = ["http"] }
nvisy-ontology = { workspace = true, features = [] }
# Text is always on at the engine layer (and up). Optional
# modalities opt-in via the matching engine feature above. The
# workspace `default-features = false` on codec/formats means
# engine's modality features are the single source of truth.
nvisy-codec = { workspace = true, features = ["text"] }
nvisy-formats = { workspace = true, features = ["text"] }

# Detection & redaction
nvisy-nlp = { workspace = true, features = [] }
nvisy-ocr = { workspace = true, features = [] }
nvisy-pattern = { workspace = true, features = [] }
nvisy-agent = { workspace = true, features = [] }

# Storage
fjall = { workspace = true, features = [] }

# Encoding
base64 = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
serde_with = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }
toml = { workspace = true, features = [] }
humantime-serde = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = [] }
futures = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
jiff = { workspace = true, features = [] }
semver = { workspace = true, features = ["serde"] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
anyhow = { workspace = true, features = [] }
derive_builder = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["deref", "deref_mut", "from", "into"] }
strum = { workspace = true, features = [] }

# Encryption and hashing
aes-gcm = { workspace = true, features = [] }
sha2 = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Utilities
validator = { workspace = true, features = [] }
rand = { workspace = true, features = [] }
tempfile = { workspace = true, features = [], optional = true }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
nvisy-engine = { path = ".", features = ["test-utils"] }
nvisy-ontology = { workspace = true, features = ["test-utils"] }
tempfile = { workspace = true, features = [] }
