# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-engine"
description = "DAG compiler and executor for Nvisy pipeline graphs"
keywords = ["nvisy", "engine", "dag", "pipeline"]
categories = ["concurrency"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = [] }

# Graph data structures
petgraph = { workspace = true, features = [] }

# Error handling
thiserror = { workspace = true, features = [] }
anyhow = { workspace = true, features = [] }

# Randomness
rand = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }
