# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-engine"
description = "Stateless redaction pipeline over elide: analyzer + anonymizer + orchestrator"
keywords = ["nvisy", "engine", "elide", "redaction"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["tabular", "image", "audio", "document"]

## Tabular modality (analyzer + anonymizer + redaction operators)
## plus every tabular codec elide ships (CSV, XLSX).
tabular = ["internal_tabular", "codec-csv", "codec-xlsx"]
## Image modality (analyzer + anonymizer + redaction operators)
## plus every image codec elide ships (PNG, JPEG, TIFF).
image = ["internal_image", "codec-png", "codec-jpeg", "codec-tiff"]
## Audio modality (analyzer + anonymizer + redaction operators)
## plus the WAV codec. MP3 is opt-in via `codec-mp3` because of
## patent licensing.
audio = ["internal_audio", "codec-wav"]
## Container-document codecs: DOCX, PDF, RTF. Standalone: text and
## image modalities are still needed to handle the parts these
## containers embed. `codec-pdf-render` (rasterising pages for
## OCR) is opt-in via its own toggle.
document = ["codec-docx", "codec-pdf", "codec-rtf"]

## Individual codec toggles. Each pulls in its modality's shared
## code (`internal_*`), so `codec-png` alone works without also
## enabling `image`.
codec-csv = ["internal_tabular", "elide/codec-csv"]
codec-xlsx = ["internal_tabular", "elide/codec-xlsx"]
codec-png = ["internal_image", "elide/codec-png"]
codec-jpeg = ["internal_image", "elide/codec-jpeg"]
codec-tiff = ["internal_image", "elide/codec-tiff"]
codec-wav = ["internal_audio", "elide/codec-wav"]
## MP3 is opt-in: MP3 patent licensing may not be satisfiable
## downstream. Off by default even when `audio` is enabled.
codec-mp3 = ["internal_audio", "elide/codec-mp3"]
## DOCX documents (a zip archive with an XML body plus embedded
## image parts).
codec-docx = ["elide/codec-docx"]
## PDF documents (text extraction).
codec-pdf = ["elide/codec-pdf"]
## PDF page rasterisation for downstream OCR. Standalone toggle
## on top of `codec-pdf`; opt-in because it drags in a native
## rendering dep.
codec-pdf-render = ["codec-pdf", "elide/codec-pdf-render"]
## RTF documents.
codec-rtf = ["elide/codec-rtf"]

# Internal shared-code gates. Not part of the public feature
# surface: enabled transitively by every user-facing feature that
# needs the corresponding modality's analyzer, anonymizer, and
# redaction operators. Never set directly by consumers.
internal_tabular = []
internal_image = []
internal_audio = []

## JSON audit export via `Audit::write_json`.
audit-json = ["dep:serde_json"]
## CSV audit export via `Audit::write_*_csv`. Pulls
## `serde_json` for reading enum-tagged operator kinds off
## reviewer overrides.
audit-csv = ["dep:csv", "dep:serde_json"]

## Turn on the test-only mock variants
## (`{Ner,Ocr,Stt,Llm}BackendConfig::Mock`) and the elide mock
## backends they compile into. Off in production so deployment
## config cannot ship a mock recognizer.
test-utils = [
    "nvisy-schema/test-utils",
    "elide/mock",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Elide crates
elide = { workspace = true, features = ["codec", "codec-text", "pattern", "ner", "ocr", "stt", "llm", "llm-rig", "llm-jinja2", "llm-openai", "llm-anthropic", "llm-gemini", "lingua", "fake", "serde", "schema", "sha2", "hmac", "aes", "datetime"] }
elide-core = { workspace = true, features = ["serde", "schema", "image", "audio", "tabular"] }

# Elide extensions
elide-bento = { workspace = true, features = ["ner", "ocr"] }

# Internal crates
nvisy-schema = { workspace = true, features = [] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [], optional = true }
schemars = { workspace = true, features = [] }
csv = { workspace = true, features = [], optional = true }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["display"] }
derive_builder = { workspace = true, features = [] }
strum = { workspace = true, features = ["derive"] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
# Internal crates
nvisy-engine = { path = ".", features = ["test-utils", "audit-json", "audit-csv"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v7"] }
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# Serialization
serde_json = { workspace = true, features = [] }

# Test utilities
zip = { workspace = true }

# Async runtime and parallelism
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
