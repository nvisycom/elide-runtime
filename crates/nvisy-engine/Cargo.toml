# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-engine"
description = "DAG compiler and executor for Nvisy pipeline graphs"
keywords = ["nvisy", "engine", "dag", "pipeline"]
categories = ["concurrency"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }
nvisy-registry = { workspace = true, features = [] }
nvisy-codec = { workspace = true, features = ["html"] }
nvisy-rig = { workspace = true, features = ["openai-gpt", "openai-whisper", "openai-tts", "anthropic-claude", "google-gemini"] }
nvisy-pattern = { workspace = true, features = [] }
nvisy-ocr = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }
serde_with = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Async runtime
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["serde", "v4"] }
jiff = { workspace = true, features = [] }
semver = { workspace = true, features = [] }

# Graph data structures
petgraph = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
anyhow = { workspace = true, features = [] }
derive_builder = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["deref", "deref_mut", "from", "into"] }
strum = { workspace = true, features = [] }

# Validation
validator = { workspace = true, features = [] }

# Randomness
rand = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }
