# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-engine"
description = "Runtime adapter over elide: Policy compile, multi-tenant registry, request orchestration"
keywords = ["nvisy", "engine", "elide", "redaction"]
categories = ["data-structures", "concurrency"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["tabular", "image", "audio", "document"]

tabular = ["elide/codec-tabular"]
image = ["elide/codec-image"]
audio = ["elide/codec-audio"]
document = ["elide/codec-document"]

## Turn on the test-only mock variants
## (`{Ner,Ocr,Stt,Llm}BackendParams::Mock`) and the elide mock
## backends they compile into. Off in production so `Nvisy.toml`
## cannot ship a mock recognizer.
test-utils = [
    "nvisy-core/test-utils",
    "elide/mock",
    "elide-ocr/mock",
    "elide-stt/mock",
    "elide-llm/mock",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Elide toolkit (upstream). `mock` pulls the no-op NER stub; the LLM
# features pull the rig backend (`llm-rig`, needed for Ollama) plus
# the three authenticated providers.
elide = { workspace = true, features = ["codec", "codec-text", "pattern", "ner", "llm", "llm-rig", "llm-openai", "llm-anthropic", "llm-gemini", "lingua", "serde", "schema", "sha2"] }

# `Jinja2Prompt` loader for deployment-configured per-recognizer
# prompt templates. Not re-exported from the elide umbrella, so
# we depend directly.
elide-llm = { workspace = true, features = ["jinja2"] }
elide-core = { workspace = true, features = ["serde", "schema", "image", "audio", "tabular"] }

# Recognition-side elide crates not re-exported through the elide
# umbrella the way the recognizer crates are (`elide::recognition::*`
# is the natural reach for those). `elide-ocr` is the OCR enricher
# layer engine wires from the image-modality compile path.
elide-ocr = { workspace = true, features = [] }
elide-stt = { workspace = true, features = [] }

# Runtime-owned elide extensions
elide-bento = { workspace = true, features = ["ner", "ocr"] }

# Derive macros
derive_more = { workspace = true, features = ["as_ref", "deref", "from"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v7"] }
semver = { workspace = true, features = ["serde"] }
hipstr = { workspace = true, features = ["serde"] }
jiff = { workspace = true, features = ["serde"] }
bytes = { workspace = true, features = [] }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["uuid1", "semver1"] }
sha2 = { workspace = true, features = [] }

# Async runtime — `time` powers the per-doc timeout wrapping
# the analyze fan-out; `rt` powers the sweeper background task
# spawned by `Engine::start_sweeper`.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

# Concurrent stream combinators for the analyze fan-out.
# `stream::iter(...).buffer_unordered(N)` is the engine's
# non-spawn concurrency primitive — caps in-flight work at N
# while keeping every per-doc future borrowing the codec
# registry + spec for free.
futures = { workspace = true, features = ["std"] }

# Multi-tenant storage
fjall = { workspace = true, features = [] }

# Resource serialisation (policy / context / run blobs in fjall)
serde_json = { workspace = true, features = [] }

# Structured logging — used inline at warn/error points where the
# engine wants to surface a non-fatal anomaly to operators (unknown
# builtin label name in a catalog request, etc.).
tracing = { workspace = true, features = [] }

[dev-dependencies]
# Turn on the test-only mock variants
# (`{Ner,Ocr,Stt,Llm}BackendParams::Mock`) so integration tests
# can construct a working analyzer without hitting a real Bento
# backend or LLM provider. Off in production so `Nvisy.toml`
# cannot ship a mock recognizer.
nvisy-engine = { path = ".", features = ["test-utils"] }

# Async runtime and parallelism
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Test utilities
tempfile = { workspace = true, features = [] }
zip = { workspace = true }
