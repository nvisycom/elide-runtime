# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-engine"
description = "Runtime adapter over elide: Policy compile, multi-tenant registry, request orchestration"
keywords = ["nvisy", "engine", "elide", "redaction"]
categories = ["data-structures", "concurrency"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = true

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["tabular", "image", "audio"]

tabular = ["elide/codec-tabular"]
image = ["elide/codec-image"]
audio = ["elide/codec-audio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Elide toolkit (upstream)
elide = { workspace = true, features = ["codec", "codec-text", "pattern", "ner", "llm", "serde"] }
elide-core = { workspace = true, features = ["serde", "image", "audio", "tabular"] }
elide-llm = { workspace = true, features = ["openai-gpt", "anthropic-claude", "google-gemini"] }

# Derive macros
derive_more = { workspace = true, features = ["as_ref", "deref", "from"] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Multi-tenant storage
fjall = { workspace = true, features = [] }
