# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-fake"
description = "Locale-aware fake-data Anonymizer for Nvisy entities"
keywords = ["nvisy", "fake", "anonymizer", "pii"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = true

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nvisy-core = { workspace = true, features = [] }

fake = { workspace = true, features = [] }
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true, features = [] }

[dev-dependencies]
nvisy-core = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt", "macros"] }
