# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-formats"
description = "Format-specific loaders and handlers (PDF, DOCX, HTML, XLSX, PNG, JPEG, …) for the Nvisy multimodal redaction platform"
keywords = ["nvisy", "loader", "pdf", "docx", "xlsx"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["txt", "json", "markdown", "csv"]

# Modality aliases — usually selected transitively by a format feature
# below, but consumers can enable them directly to compile the
# corresponding modality's infra in `nvisy-codec` without any concrete
# loader.
text = ["nvisy-codec/text"]
tabular = ["nvisy-codec/tabular"]
image = ["nvisy-codec/image"]
audio = ["nvisy-codec/audio"]
rich = ["nvisy-codec/rich"]

# Text formats.
txt = ["text"]
json = ["text"]
markdown = ["text"]
html = ["text", "dep:scraper"]

# Tabular formats.
csv = ["tabular", "dep:csv"]
xlsx = ["tabular", "dep:calamine"]

# Image formats. All three image formats are bundled with the `image`
# crate's matching feature so each opts-in to the necessary decoder.
png = ["image", "image/png"]
jpeg = ["image", "image/jpeg"]
tiff = ["image", "image/tiff"]

# Audio formats.
wav = ["audio", "dep:hound"]
mp3 = ["audio", "dep:hound"]

# Rich-document formats.
pdf = ["rich", "dep:lopdf", "dep:pdfium-render", "dep:rayon"]
docx = ["rich", "dep:zip", "dep:quick-xml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-codec = { workspace = true, features = [] }
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["sync"] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# Derive macros and error handling
derive_more = { workspace = true, features = ["as_ref", "deref", "deref_mut", "display", "from"] }
thiserror = { workspace = true, features = [] }

# Image processing — image transitively from `nvisy-codec/image` when
# any image format is enabled; we need a direct dep so the
# `image/png` etc. feature toggles resolve.
image = { workspace = true, optional = true, features = [] }

# Audio processing (feature-gated)
hound = { workspace = true, optional = true, features = [] }

# PDF processing (feature-gated)
lopdf = { workspace = true, optional = true, features = [] }
pdfium-render = { workspace = true, optional = true, features = [] }
rayon = { workspace = true, optional = true, features = [] }

# Document parsing (feature-gated)
calamine = { workspace = true, optional = true, features = [] }
csv = { workspace = true, optional = true, features = [] }
quick-xml = { workspace = true, optional = true, features = [] }
scraper = { workspace = true, optional = true, features = [] }
zip = { workspace = true, optional = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
