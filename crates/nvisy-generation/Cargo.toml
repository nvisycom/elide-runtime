# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-generation"
description = "Content generation actions (OCR, transcription, synthetic data) for Nvisy"
keywords = ["nvisy", "generation", "ocr", "transcription"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-detection = { workspace = true, features = [] }
nvisy-redaction = { workspace = true, features = [] }
nvisy-codec = { workspace = true, features = [] }
nvisy-python = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
async-trait = { workspace = true, features = [] }
