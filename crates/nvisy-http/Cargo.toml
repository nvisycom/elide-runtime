# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-http"
description = "Shared HTTP client (reqwest + retry + tracing middleware) for the Nvisy runtime"
keywords = ["nvisy", "http", "reqwest", "retry", "tracing"]
categories = ["web-programming::http-client"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# HTTP client and middleware
reqwest-middleware = { workspace = true, features = [] }
reqwest-retry = { workspace = true, features = [] }
reqwest-tracing = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
humantime-serde = { workspace = true, features = [] }

# Derive macros
derive_more = { workspace = true, features = ["deref"] }

# Observability
tracing = { workspace = true, features = [] }
