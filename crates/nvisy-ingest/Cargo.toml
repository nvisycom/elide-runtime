# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ingest"
description = "File-format loaders for the Nvisy multimodal redaction platform"
keywords = ["nvisy", "ingest", "loader", "pdf", "docx"]
categories = ["parser-implementations"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["pdf", "docx", "html", "xlsx", "parquet", "image"]
pdf = ["dep:pdf-extract", "dep:lopdf"]
docx = ["dep:zip", "dep:quick-xml"]
html = ["dep:scraper"]
xlsx = ["dep:calamine"]
parquet = ["dep:parquet", "dep:arrow"]
image = ["dep:image"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
bytes = { workspace = true }

# Observability
tracing = { workspace = true, features = [] }

# File type detection
infer = { workspace = true }

# Document parsing (feature-gated)
pdf-extract = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
image = { workspace = true, optional = true }
