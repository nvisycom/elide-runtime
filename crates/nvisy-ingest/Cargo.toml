# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ingest"
description = "File-format loaders and unified Document type for the Nvisy multimodal redaction platform"
keywords = ["nvisy", "ingest", "loader", "pdf", "docx"]
categories = ["parser-implementations"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["pdf", "docx", "html", "xlsx", "image"]
# PDF parsing and text extraction via pdf-extract + lopdf
pdf = ["dep:pdf-extract", "dep:lopdf"]
# Microsoft Word (.docx) parsing via zip + quick-xml
docx = ["dep:zip", "dep:quick-xml"]
# HTML parsing and text extraction via scraper
html = ["dep:scraper"]
# Excel (.xlsx) spreadsheet parsing via calamine
xlsx = ["dep:calamine"]
# Image decoding (PNG, JPEG, TIFF) via the image crate
image = ["dep:image"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# JSON Schema generation
schemars = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
bytes = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# File type detection
infer = { workspace = true, features = [] }

# Document parsing (feature-gated)
pdf-extract = { workspace = true, optional = true, features = [] }
lopdf = { workspace = true, optional = true, features = [] }
zip = { workspace = true, optional = true, features = [] }
quick-xml = { workspace = true, optional = true, features = [] }
scraper = { workspace = true, optional = true, features = [] }
calamine = { workspace = true, optional = true, features = [] }
image = { workspace = true, optional = true, features = [] }
