# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-media"
description = "Pixel-level image redaction, tabular redaction, and PDF reassembly for Nvisy"
keywords = ["nvisy", "media", "redaction", "image", "pdf"]
categories = ["multimedia::images"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
bytes = { workspace = true }

# Image processing
image = { workspace = true }
imageproc = { workspace = true }

# PDF manipulation
lopdf = { workspace = true }

# Observability
tracing = { workspace = true, features = [] }
