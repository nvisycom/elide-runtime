# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-nlp"
description = "NLP / NER backends and a composable engine for the Nvisy runtime"
keywords = ["nvisy", "nlp", "ner", "pii"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# A plain build of `nvisy-nlp` ships only the no-op NER backend
# (`NoopNerBackend`), the Lingua language policy, and the Unicode
# tokenizer. The two model-bearing NER backends are behind opt-in
# features that pull in heavy ML deps.
default = []

## Enables `OrtNerBackend` — runs a BERT-family token-classification
## model exported to ONNX via the `ort` crate. Also enables the
## `HfTokenizer` since its `tokenizers` dep is pulled in here
## anyway.
onnx = ["dep:ort", "dep:ndarray", "dep:tokenizers"]

## Enables `GlinerBackend` — zero-shot NER via `gline-rs`.
## Compatible with `onnx`; both backends can be enabled
## simultaneously.
gliner = ["dep:gline-rs", "dep:orp"]

## Enables auto-download of manifest-defined preset artifacts from
## HuggingFace Hub plus SHA-256 verification (downloaded or supplied).
## Activates `nvisy-core/hf` for the shared `Downloader` and
## `FetchRequest::verify_artifact`. Without it, `NlpPreset::Manifest`
## still works as long as `model_path` and `tokenizer_path` overrides
## are supplied, but `*_sha256` fields in the manifest are not enforced.
hf = ["nvisy-core/hf"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# Async
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

# ONNX inference stack
ort = { workspace = true, optional = true, features = [] }
ndarray = { workspace = true, optional = true, features = [] }
tokenizers = { workspace = true, optional = true, features = [] }

# GLiNER zero-shot NER
gline-rs = { workspace = true, optional = true, features = [] }
orp = { workspace = true, optional = true, features = [] }

# Language detection and text segmentation
lingua = { workspace = true, features = [] }
stop-words = { workspace = true, features = [] }
unicode-segmentation = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_builder = { workspace = true, features = [] }

# Identifiers
uuid = { workspace = true, features = ["v4"] }

# Collections / utility
smallvec = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = ["test-utils"] }
