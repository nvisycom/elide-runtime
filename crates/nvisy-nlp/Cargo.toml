# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-nlp"
description = "NLP traits and language detection for the Nvisy runtime"
keywords = ["nvisy", "nlp", "ner", "pii"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enables [`BentoNerBackend`]: zero-shot NER over an externalized
## HTTP inference service (the `inference-gliner` Bento in
## https://github.com/nvisycom/inference).
bento = ["dep:bentoml", "dep:serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# Async
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

# Inference & AI frameworks
bentoml = { workspace = true, optional = true }

# Language detection
lingua = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [], optional = true }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_builder = { workspace = true, features = [] }

# Identifiers
uuid = { workspace = true, features = ["v4", "v7"] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
nvisy-ontology = { workspace = true, features = ["test-utils"] }
