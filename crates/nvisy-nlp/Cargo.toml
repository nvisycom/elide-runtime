# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-nlp"
description = "NLP / NER backends and a composable engine for the Nvisy runtime"
keywords = ["nvisy", "nlp", "ner", "pii"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `NlpPreset::Default` is the no-op backend (`NoopNerBackend`), used
# in tests and for deployments wiring detection through patterns/LLM
# only. Real model presets live behind their own features.
default = ["test-utils"]

# Exposes helpers intended for downstream tests.
test-utils = []

# Enables auto-download of manifest-defined preset artifacts from
# HuggingFace Hub plus SHA-256 verification of downloaded or supplied
# artifacts. Without it, `NlpPreset::Manifest` still works as long as
# `model_path` and `tokenizer_path` overrides are supplied, but
# `model_sha256` / `tokenizer_sha256` fields in the manifest are not
# enforced.
preset-download = ["dep:hf-hub", "dep:dirs", "dep:sha2"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# Async
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

# NLP / NER
ort = { workspace = true, features = [] }
ndarray = { workspace = true, features = [] }
tokenizers = { workspace = true, features = [] }
lingua = { workspace = true, features = [] }
stop-words = { workspace = true, features = [] }
unicode-segmentation = { workspace = true, features = [] }

# Model download + hash verification (optional; enabled by preset features)
hf-hub = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_builder = { workspace = true, features = [] }

# Identifiers
uuid = { workspace = true, features = ["v4"] }

# Collections / utility
smallvec = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = ["test-utils"] }
