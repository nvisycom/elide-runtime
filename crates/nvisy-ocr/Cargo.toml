# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ocr"
description = "OCR backend trait and provider integration for Nvisy"
keywords = ["nvisy", "ocr", "text-extraction"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enable AWS Textract OCR provider.
aws-textract = ["sha2", "hmac"]
## Enable Google Cloud Vision OCR provider.
google-vision = []
## Enable Azure Document Intelligence OCR provider.
azure-docai = ["tokio/time"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-http = { workspace = true, features = [] }

# Encoding and hashing
base64 = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }
sha2 = { workspace = true, optional = true, features = [] }
hmac = { workspace = true, optional = true, features = [] }

# Derive macros and error handling
strum = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt"] }

# HTTP middleware
reqwest-middleware = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }
