# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ocr"
description = "OCR provider integrations (AWS Textract, Google Vision, Azure DocAI, Surya, PaddleX) for the Nvisy runtime"
keywords = ["nvisy", "ocr", "textract", "vision"]
categories = ["text-processing", "computer-vision"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enable AWS Textract OCR provider.
aws-textract = ["sha2", "hmac"]
## Enable Google Cloud Vision OCR provider.
google-vision = []
## Enable Azure Document Intelligence OCR provider.
azure-docai = ["tokio/time"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-http = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "time"] }

# HTTP middleware (multipart + JSON helpers used by backends directly)
reqwest-middleware = { workspace = true, features = ["json", "multipart"] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

# Encoding and hashing
base64 = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }
sha2 = { workspace = true, optional = true, features = [] }
hmac = { workspace = true, optional = true, features = [] }

# Error handling
thiserror = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
