# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ocr"
description = "OCR backend trait and provider integration for Nvisy"
keywords = ["nvisy", "ocr", "text-extraction"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }
nvisy-python = { workspace = true, features = [] }

# OCR engine (Rust-native PaddleOCR via ONNX Runtime)
oar-ocr = { workspace = true }

# Image decoding
image = { workspace = true }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt"] }
