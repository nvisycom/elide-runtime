# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ocr"
description = "OCR provider integrations & backend abstraction for the Nvisy runtime"
keywords = ["nvisy", "ocr", "vision"]
categories = ["text-processing", "computer-vision"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enables [`BentoOcrBackend`]: externalised OCR over an HTTP
## inference service (the `inference-ocr` Bento in
## https://github.com/nvisycom/inference). Scaffolding only until
## the wire contract is finalised upstream — see
## https://github.com/nvisycom/runtime/issues/128.
bento = ["dep:bentoml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt"] }

# BentoML inference client (feature-gated)
bentoml = { workspace = true, optional = true }

# (De)serialization
serde = { workspace = true, features = [] }

# Primitive datatypes (UUIDv7 for per-call request IDs from the
# Bento backend; behind the `bento` feature gate at use sites).
uuid = { workspace = true, features = ["v4", "v7"] }

# Encoding
base64 = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
