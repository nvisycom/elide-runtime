# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ontology"
description = "Domain data types, entity taxonomy, and spatial primitives for the Nvisy platform"
keywords = ["nvisy", "ontology", "data", "types"]
categories = ["data-structures"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }
serde_with = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Derive macros and error handling
derive_more = { workspace = true, features = ["from"] }
strum = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
jiff = { workspace = true, features = [] }
semver = { workspace = true, features = [] }
