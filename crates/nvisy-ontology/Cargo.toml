# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-ontology"
description = "Domain data types, entity taxonomy, and spatial primitives for the Nvisy platform"
keywords = ["nvisy", "ontology", "data", "types"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = true

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
serde_with = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }
derive_builder = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["deref", "deref_mut", "display", "from", "into", "into_iterator"] }
strum = { workspace = true, features = [] }
validator = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
jiff = { workspace = true, features = [] }
semver = { workspace = true, features = [] }
