# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-pattern"
description = "Built-in regex patterns and dictionaries for PII/PHI detection"
keywords = ["nvisy", "pattern", "pii", "dictionary"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# (De)serialization
csv = { workspace = true, features = [] }
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }

# Versioning (sidecar metadata)
semver = { workspace = true, features = ["serde"] }

# Storage, file detection, and asset embedding
include_dir = { workspace = true, features = [] }

# Filesystem traversal
walkdir = { workspace = true, features = [] }

# Derive macros and error handling
thiserror = { workspace = true, features = [] }

# Pattern matching
regex = { workspace = true, features = [] }
aho-corasick = { workspace = true, features = [] }
smallvec = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tempfile = { workspace = true }
