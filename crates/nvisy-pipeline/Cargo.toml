# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-pipeline"
description = "Pipeline action/provider traits with detection and redaction actions for Nvisy"
keywords = ["nvisy", "pipeline", "detection", "redaction"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["image-redaction", "pdf-redaction"]
# Image blur/block redaction via image + imageproc
image-redaction = ["dep:image", "dep:imageproc"]
# PDF reassembly with redacted content via lopdf
pdf-redaction = ["dep:lopdf"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true }
nvisy-ingest = { workspace = true }
nvisy-pattern = { workspace = true }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
bytes = { workspace = true }

# Text processing
regex = { workspace = true, features = [] }
aho-corasick = { workspace = true }

# Observability
tracing = { workspace = true, features = [] }

# Image processing (feature-gated)
image = { workspace = true, optional = true }
imageproc = { workspace = true, optional = true }

# PDF manipulation (feature-gated)
lopdf = { workspace = true, optional = true }
