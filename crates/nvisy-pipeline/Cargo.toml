# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-pipeline"
description = "Pipeline action/provider traits with detection and redaction actions for Nvisy"
keywords = ["nvisy", "pipeline", "detection", "redaction"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["image-redaction", "audio-redaction"]
# Image redaction (blur, block); enables nvisy-codec image handlers and rendering
image-redaction = ["nvisy-codec/png", "nvisy-codec/jpeg"]
# Audio redaction pass-through; enables nvisy-codec/wav for WavHandler
audio-redaction = ["nvisy-codec/wav"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }
nvisy-codec = { workspace = true, features = [] }
nvisy-pattern = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }

# Time
jiff = { workspace = true, features = [] }

# Text processing
regex = { workspace = true, features = [] }
aho-corasick = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }
