# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-provider"
description = "External service providers: HTTP client, OCR, LLM agents, STT, TTS"
keywords = ["nvisy", "provider", "ocr", "llm", "http"]
categories = ["web-programming::http-client", "text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enable AWS Textract OCR provider.
aws-textract = ["sha2", "hmac"]
## Enable Google Cloud Vision OCR provider.
google-vision = []
## Enable Azure Document Intelligence OCR provider.
azure-docai = ["tokio/time"]
## Enable OpenAI GPT completion provider.
openai-gpt = []
## Enable OpenAI Whisper speech-to-text provider.
openai-whisper = []
## Enable OpenAI text-to-speech provider.
openai-tts = []
## Enable Anthropic Claude completion provider.
anthropic-claude = []
## Enable Google Gemini completion provider.
google-gemini = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# LLM framework
rig = { workspace = true, features = ["derive", "reqwest-middleware", "audio"] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "time"] }

# HTTP client and middleware
reqwest-middleware = { workspace = true, features = [] }
reqwest-retry = { workspace = true, features = [] }
reqwest-tracing = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

# Encoding and hashing
base64 = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }
sha2 = { workspace = true, optional = true, features = [] }
hmac = { workspace = true, optional = true, features = [] }

# Derive macros and error handling
derive_more = { workspace = true, features = ["deref"] }
thiserror = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
