# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-python"
description = "PyO3 bridge for AI NER/OCR detection via embedded Python"
keywords = ["nvisy", "python", "pyo3", "ner"]
categories = ["api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# (De)serialization
serde_json = { workspace = true, features = [] }

# Primitive datatypes
hipstr = { workspace = true, features = [] }

# Async runtime and parallelism
tokio = { workspace = true, features = ["sync", "rt"] }

# Python interop
pyo3 = { workspace = true, features = ["auto-initialize"] }
pyo3-async-runtimes = { workspace = true, features = [] }
pythonize = { workspace = true, features = [] }
