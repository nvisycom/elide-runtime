# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-redaction"
description = "Redaction types, policy evaluation, and application for Nvisy"
keywords = ["nvisy", "redaction", "policy", "privacy"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-detection = { workspace = true, features = [] }
nvisy-codec = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }

# Time
jiff = { workspace = true, features = [] }

# Semantic versioning
semver = { workspace = true, features = [] }

# Derive macros
derive_more = { workspace = true, features = ["from"] }

# Enum utilities
strum = { workspace = true, features = ["derive"] }

# JSON Schema generation
schemars = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }
