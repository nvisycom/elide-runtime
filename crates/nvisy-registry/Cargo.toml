# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-registry"
description = "Actor-scoped content and context storage backed by fjall"
keywords = ["nvisy", "registry", "storage", "actor"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# Embedded key-value store
fjall = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["sync", "rt"] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

[dev-dependencies]
tempfile = { workspace = true, features = [] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
