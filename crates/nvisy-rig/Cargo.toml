# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-rig"
description = "LLM agents (NER, CV, generate, STT/TTS, OCR-verifier) over the rig framework for the Nvisy runtime"
keywords = ["nvisy", "rig", "llm", "ner", "agent"]
categories = ["text-processing", "api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enable OpenAI GPT completion provider.
openai-gpt = []
## Enable OpenAI Whisper speech-to-text provider.
openai-whisper = []
## Enable OpenAI text-to-speech provider.
openai-tts = []
## Enable Anthropic Claude completion provider.
anthropic-claude = []
## Enable Google Gemini completion provider.
google-gemini = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-http = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# LLM framework
rig = { workspace = true, features = ["derive", "reqwest-middleware", "audio"] }

# Async runtime and parallelism
async-trait = { workspace = true, features = [] }
futures = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "time"] }

# HTTP middleware (used for ClientWithMiddleware type passthrough)
reqwest-middleware = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

# Encoding and hashing
base64 = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

# Error handling
thiserror = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
