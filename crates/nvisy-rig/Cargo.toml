[package]
name = "nvisy-rig"
description = "LLM/VLM-driven detection, redaction, and OCR backends"
keywords = ["nvisy", "rig", "llm", "vlm", "ocr"]
categories = ["text-processing"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-codec = { workspace = true, features = [] }
nvisy-core = { workspace = true, features = [] }

# LLM framework
rig-core = { workspace = true, features = ["derive"] }

# Async runtime
async-trait = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }
