# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-rig"
description = "LLM/VLM-driven detection, redaction, and OCR backends"
keywords = ["nvisy", "rig", "llm", "vlm", "ocr"]
categories = ["text-processing"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enable OpenAI GPT completion provider.
openai-gpt = []
## Enable OpenAI Whisper speech-to-text provider.
openai-whisper = []
## Enable OpenAI text-to-speech provider.
openai-tts = []
## Enable Anthropic Claude completion provider.
anthropic-claude = []
## Enable Google Gemini completion provider.
google-gemini = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }

# LLM framework
rig-core = { workspace = true, features = ["derive", "reqwest-middleware", "audio"] }

# Async runtime
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["time"] }

# HTTP middleware (retry & tracing)
reqwest-middleware = { workspace = true, features = [] }
reqwest-retry = { workspace = true, features = [] }
reqwest-tracing = { workspace = true, features = [] }

# Encoding
base64 = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Error handling
thiserror = { workspace = true, features = [] }

# Identifiers
uuid = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
