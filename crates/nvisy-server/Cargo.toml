# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-server"
description = "HTTP server library exposing the nvisy Engine pipeline via REST endpoints"
keywords = ["nvisy", "server", "http", "api"]
categories = ["web-programming::http-server"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

## Enable all OpenAI providers (GPT, Whisper STT, TTS).
openai = ["nvisy-engine/openai"]
## Enable Anthropic Claude completion provider.
anthropic = ["nvisy-engine/anthropic"]
## Enable Google Gemini + Google Cloud Vision OCR.
google = ["nvisy-engine/google"]
## Enable Azure Document Intelligence OCR.
microsoft = ["nvisy-engine/microsoft"]
## Enable AWS Textract OCR.
amazon = ["nvisy-engine/amazon"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-engine = { workspace = true, features = [] }
nvisy-ontology = { workspace = true, features = [] }
nvisy-registry = { workspace = true, features = [] }
nvisy-http = { workspace = true, features = [] }

# Async runtime and parallelism
futures = { workspace = true, features = [] }

# HTTP server
axum = { workspace = true, features = ["json", "multipart", "tokio"] }
aide = { workspace = true, features = ["axum", "axum-json", "axum-query", "scalar", "macros"] }
tower = { workspace = true, features = ["util", "timeout"] }
tower-http = { workspace = true, features = ["trace", "cors", "timeout", "request-id", "limit", "compression-gzip", "compression-br", "compression-zstd", "sensitive-headers", "catch-panic", "util"] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
serde_with = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Encoding and hashing
base64 = { workspace = true, features = [] }

# Derive macros
derive_more = { workspace = true, features = ["deref", "display"] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
jiff = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
