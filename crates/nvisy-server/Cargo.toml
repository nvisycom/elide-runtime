# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-server"
description = "HTTP server library exposing the nvisy Engine pipeline via REST endpoints"
keywords = ["nvisy", "server", "http", "api"]
categories = ["web-programming::http-server"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["tabular", "image", "audio", "document"]

## Tabular modality — csv, xlsx.
tabular = ["nvisy-engine/tabular"]
## Image modality — png, jpeg, tiff.
image = ["nvisy-engine/image"]
## Audio modality — wav, mp3.
audio = ["nvisy-engine/audio"]
## Document containers — docx (text body + image parts).
document = ["nvisy-engine/document"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-engine = { workspace = true, features = [] }

# Upstream elide — server consumes modality + entity types
# directly when rendering wire responses. Default features
# off so server picks per-modality codec features explicitly
# via its own `tabular` / `image` / `audio` flags.
elide-core = { workspace = true, features = ["tabular", "image", "audio", "serde", "schema"] }

# Serialization
serde = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }
humantime-serde = { workspace = true, features = [] }

# Derive macros and error handling
derive_more = { workspace = true, features = ["deref", "display"] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
jiff = { workspace = true, features = [] }
semver = { workspace = true, features = ["serde"] }

# Async runtime and parallelism
futures = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

# HTTP server and middleware
axum = { workspace = true, features = ["json", "multipart", "tokio"] }
aide = { workspace = true, features = ["axum", "axum-json", "axum-query", "scalar", "macros"] }
tower = { workspace = true, features = ["util", "timeout"] }
tower-http = { workspace = true, features = ["trace", "cors", "timeout", "request-id", "limit", "compression-gzip", "compression-br", "compression-zstd", "sensitive-headers", "catch-panic", "util"] }

[dev-dependencies]
# Serialization
serde_json = { workspace = true, features = [] }

# Primitive datatypes
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }

# Async runtime and parallelism
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# HTTP test driver
axum-test = { workspace = true }

# Test utilities
tempfile = { workspace = true, features = [] }
zip = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]
