# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-server"
description = "Axum HTTP server for the Nvisy data protection platform"
keywords = ["nvisy", "server", "http", "axum"]
categories = ["web-programming::http-server"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[[bin]]
name = "nvisy-server"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = ["schema"] }
nvisy-detect = { workspace = true }
nvisy-engine = { workspace = true, features = ["schema"] }
nvisy-ingest = { workspace = true }
nvisy-media = { workspace = true }
nvisy-ontology = { workspace = true }
nvisy-python = { workspace = true }

# JSON Schema generation
schemars = { workspace = true }

# (De)serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

# HTTP server
axum = { workspace = true, features = ["http2", "macros", "multipart"] }
tower = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["cors", "trace", "request-id", "limit"] }

# OpenAPI / Documentation
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-scalar = { workspace = true, features = ["axum"] }

# Primitive datatypes
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }
tracing-subscriber = { workspace = true, features = ["fmt", "ansi", "json", "env-filter"] }

# Encoding
base64 = { workspace = true }

# Binary data
bytes = { workspace = true }

# Error handling
thiserror = { workspace = true, features = [] }
anyhow = { workspace = true, features = ["backtrace"] }
