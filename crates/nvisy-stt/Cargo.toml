# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-stt"
description = "Speech-to-text extractor (transcription + timestamps + diarization) for the Nvisy runtime"
keywords = ["nvisy", "stt", "transcription", "diarization"]
categories = ["multimedia::audio", "api-bindings"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }

# Async runtime
async-trait = { workspace = true, features = [] }

# Primitive datatypes
uuid = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
