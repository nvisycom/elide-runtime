# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "nvisy-toolkit"
description = "Composable component library for Nvisy pipelines: recognizers, dedup layers, checks, redaction strategies"
keywords = ["nvisy", "toolkit", "components", "pipeline"]
categories = ["data-structures"]
readme = "README.md"

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = true

authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }

[features]
default = ["text", "tabular", "image", "audio", "rich"]

## Re-export `DecodedBuffer<Text>` from `nvisy-codec` and pull in
## every shipped text-format codec (txt/json/markdown/html).
text = ["nvisy-codec/text"]
## Re-export `DecodedBuffer<Tabular>` and pull in csv/xlsx codecs.
tabular = ["nvisy-codec/tabular"]
## Re-export `DecodedBuffer<Image>` and pull in png/jpeg/tiff codecs.
image = ["nvisy-codec/image"]
## Re-export `DecodedBuffer<Audio>` and pull in wav/mp3 codecs.
audio = ["nvisy-codec/audio"]
## Pull in rich-document codecs (pdf/docx). Implies `image` since
## PDF rendering produces image children.
rich = ["image", "nvisy-codec/rich"]

## Reversible AES-GCM encrypt/decrypt redaction operators.
encrypt = ["dep:aes-gcm"]

## Externalised BentoML backends (NER + OCR).
bento = ["nvisy-ner/bento", "nvisy-ocr/bento"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Internal crates
nvisy-core = { workspace = true, features = [] }
nvisy-codec = { workspace = true, features = [] }
nvisy-llm = { workspace = true, features = [] }
nvisy-stt = { workspace = true, features = [] }
nvisy-ner = { workspace = true, features = [] }
nvisy-ocr = { workspace = true, features = [] }
nvisy-pattern = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
schemars = { workspace = true, features = [] }

# Async runtime
async-trait = { workspace = true, features = [] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

# Primitive datatypes
uuid = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }
hipstr = { workspace = true, features = [] }
type-map = { workspace = true, features = [] }

# Unicode-aware text folding for leak detection.
unicode-normalization = { workspace = true, features = [] }

# Cryptography for built-in redaction operators
sha2 = { workspace = true, features = [] }
aes-gcm = { workspace = true, features = ["aes", "alloc"], optional = true }
base64 = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
# Internal test utilities (Entity::test_builder, …).
nvisy-core = { workspace = true, features = ["test-utils"] }
# Pattern recognizer used by the end-to-end example.
nvisy-pattern = { workspace = true }
# Fake-data anonymizer wrapped through Vault in the integration test.
nvisy-fake = { workspace = true }
# Async-trait + tokio runtime for the example.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[example]]
name = "pipeline"
path = "examples/pipeline.rs"
