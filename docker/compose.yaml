name: elide

# The three inference services, reachable at ner/ocr/stt on port 3000 — the
# hostnames and port the server's engine configuration expects, so pointing a
# server at this stack needs no translation.
#
# Images carry no model weights. Each service has a one-shot `*-init` partner
# that warms its cache and exits; the service gates on that completing, so it
# never starts against an empty cache. With the cache warm, each service's
# HF_HUB_OFFLINE is true rather than aspirational: nothing reaches the Hub at
# request time.
#
# One init container per service, each running that service's own image. The
# three libraries are not interchangeable and no single image carries all of
# them — elide-stt has no `onnxtr`, elide-ocr has no `faster_whisper` — so a
# shared warmer would fail on whichever model its image cannot resolve. Running
# each warm in the image that will later read the cache also guarantees the
# same library version wrote it.

x-readyz: &readyz
  # Requires an image containing `elide_core.readyz`, i.e. 0.1.0-rc.4 or
  # later, which is what the services below default to. Against rc.3 or
  # earlier the probe exits "No module named elide_core.readyz" and every
  # service goes unhealthy, so the tag and this file move together.
  #
  # `python -m elide_core.readyz`, not curl: the BentoML images are built on
  # python:3.12-slim, which ships neither curl nor wget (nor nc). The probe
  # lives in elide-core (shipped into every image by build_include) rather
  # than inline here, because it has branches worth testing — see its
  # docstring for what each exit reason means.
  test:
    - CMD
    - python
    - -m
    - elide_core.readyz
  interval: 10s
  timeout: 5s
  retries: 5
  # /readyz gates on the model: the HTTP server binds first and answers only
  # once __init__ has finished loading, so a 200 means the service can serve.
  # Measured from container start to the first 200, weights already cached:
  #
  #     ner 10.3s  (model load 9.7s)
  #     ocr  8.2s  (model load 2.2s)
  #     stt  5.2s  (model load 2.4s)
  #
  # 60s is a deliberately wide margin over the slowest. These come from one
  # idle host with a warm cache; a loaded or throttled one is slower, and the
  # cost of being generous here is only how long a genuinely broken service
  # takes to be reported. The previous 120s predated any measurement.
  start_period: 60s

x-service: &service
  restart: unless-stopped
  networks:
    - elide

# Each model id reaches both a service and its warmer from one variable, so the
# warm cannot drift from what the service loads.
x-ner-model: &ner-model ${ELIDE_NER_MODEL:-fastino/gliner2-privacy-filter-PII-multi}
x-ocr-detection: &ocr-detection ${ELIDE_OCR_DETECTION:-db_resnet50}
x-ocr-recognition: &ocr-recognition ${ELIDE_OCR_RECOGNITION:-Felix92/onnxtr-parseq-multilingual-v1@7d7329948dbcff02637a3eb9c14ae0c4440c5ed0}
x-stt-model: &stt-model ${ELIDE_STT_MODEL:-large-v3-turbo}

services:
  # --- NER ------------------------------------------------------------------

  ner-init:
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.7}
    container_name: elide-ner-init
    # Root so it can populate a freshly created named volume, whose
    # mountpoint Docker owns as root; the final chown hands the cache to
    # the uid the service runs as. The service itself never runs as root.
    user: root
    # The id arrives through the environment rather than the command text, so a
    # value containing shell metacharacters cannot alter what runs.
    environment:
      HF_HOME: /cache/huggingface
      # The image bakes HF_HUB_OFFLINE=1 (the service declares it, so it lands
      # in the image env). The warmer is the one process that must reach the
      # Hub, so it turns both off for itself only.
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      ELIDE_BENTO_NER_MODEL: *ner-model
    entrypoint: ["python", "-m", "elide_ner.warm"]
    volumes:
      - hf_cache:/cache/huggingface
    networks:
      - elide

  ner:
    <<: *service
    image: ${ELIDE_NER_IMAGE:-ghcr.io/nvisycom/elide-ner}:${ELIDE_VERSION:-0.1.0-rc.7}
    container_name: elide-ner
    ports:
      - "${ELIDE_NER_PORT:-3100}:3000"
    environment:
      HF_HOME: /cache/huggingface
      # True once ner-init has run: the model resolves from the cache and the
      # Hub is never reached, so request text cannot leave the network.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ELIDE_BENTO_NER_MODEL: *ner-model
      ELIDE_BENTO_NER_QUANTIZE: ${ELIDE_NER_QUANTIZE:-}
      ELIDE_BENTO_NER_MAX_TOKENS: ${ELIDE_NER_MAX_TOKENS:-512}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - hf_cache:/cache/huggingface:ro
    healthcheck: *readyz
    depends_on:
      ner-init:
        condition: service_completed_successfully

  # --- OCR ------------------------------------------------------------------

  ocr-init:
    image: ${ELIDE_OCR_IMAGE:-ghcr.io/nvisycom/elide-ocr}:${ELIDE_VERSION:-0.1.0-rc.7}
    container_name: elide-ocr-init
    # Root so it can populate a freshly created named volume, whose
    # mountpoint Docker owns as root; the final chown hands the cache to
    # the uid the service runs as. The service itself never runs as root.
    user: root
    # No ELIDE_BENTO_OCR_DEVICE: the warmer needs only the weights, which are
    # the same files for either device, so it builds on CPU and needs no GPU.
    environment:
      ONNXTR_CACHE_DIR: /cache/onnxtr
      HF_HOME: /cache/huggingface
      # The image bakes HF_HUB_OFFLINE=1 for the service; the warmer is the
      # one process that must reach the Hub, so it turns that off for itself.
      HF_HUB_OFFLINE: "0"
      ELIDE_BENTO_OCR_DETECTION: *ocr-detection
      ELIDE_BENTO_OCR_RECOGNITION: *ocr-recognition
    entrypoint: ["python", "-m", "elide_ocr.warm"]
    volumes:
      - ocr_cache:/cache
    networks:
      - elide

  ocr:
    <<: *service
    image: ${ELIDE_OCR_IMAGE:-ghcr.io/nvisycom/elide-ocr}:${ELIDE_VERSION:-0.1.0-rc.7}
    container_name: elide-ocr
    ports:
      - "${ELIDE_OCR_PORT:-3101}:3000"
    environment:
      # Once ocr-init has run, a built-in checkpoint is found in the OnnxTR
      # cache with a matching hash, and a Hub model at its pinned commit in
      # the Hugging Face cache, so the service makes no request.
      ONNXTR_CACHE_DIR: /cache/onnxtr
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      ELIDE_BENTO_OCR_DETECTION: *ocr-detection
      ELIDE_BENTO_OCR_RECOGNITION: *ocr-recognition
      ELIDE_BENTO_OCR_DEVICE: ${ELIDE_OCR_DEVICE:-cpu}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - ocr_cache:/cache:ro
    healthcheck: *readyz
    depends_on:
      ocr-init:
        condition: service_completed_successfully

  # --- STT ------------------------------------------------------------------

  stt-init:
    image: ${ELIDE_STT_IMAGE:-ghcr.io/nvisycom/elide-stt}:${ELIDE_VERSION:-0.1.0-rc.7}
    container_name: elide-stt-init
    # Root so it can populate a freshly created named volume, whose
    # mountpoint Docker owns as root; the final chown hands the cache to
    # the uid the service runs as. The service itself never runs as root.
    user: root
    environment:
      HF_HOME: /cache/huggingface
      # The image bakes HF_HUB_OFFLINE=1 for the service; the warmer is the
      # one process that must reach the Hub, so it turns that off for itself.
      HF_HUB_OFFLINE: "0"
      ELIDE_BENTO_STT_MODEL: *stt-model
      # Diarization is off by default: its model is gated on the Hub, so it
      # cannot be redistributed in an image and needs accepted terms to fetch.
      ELIDE_BENTO_STT_DIARIZE: ${ELIDE_STT_DIARIZE:-false}
      ELIDE_BENTO_STT_DIARIZE_MODEL: ${ELIDE_STT_DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      ELIDE_BENTO_STT_HF_TOKEN: ${ELIDE_STT_HF_TOKEN:-}
    entrypoint: ["python", "-m", "elide_stt.warm"]
    volumes:
      - hf_cache:/cache/huggingface
    networks:
      - elide

  stt:
    <<: *service
    image: ${ELIDE_STT_IMAGE:-ghcr.io/nvisycom/elide-stt}:${ELIDE_VERSION:-0.1.0-rc.7}
    container_name: elide-stt
    ports:
      - "${ELIDE_STT_PORT:-3102}:3000"
    environment:
      HF_HOME: /cache/huggingface
      # True once stt-init has run: the models resolve from the cache, so
      # request audio cannot cause a request to the Hub.
      HF_HUB_OFFLINE: "1"
      ELIDE_BENTO_STT_MODEL: *stt-model
      ELIDE_BENTO_STT_DEVICE: ${ELIDE_STT_DEVICE:-cpu}
      ELIDE_BENTO_STT_COMPUTE_TYPE: ${ELIDE_STT_COMPUTE_TYPE:-}
      ELIDE_BENTO_STT_DIARIZE: ${ELIDE_STT_DIARIZE:-false}
      ELIDE_BENTO_STT_DIARIZE_MODEL: ${ELIDE_STT_DIARIZE_MODEL:-pyannote/speaker-diarization-community-1}
      ELIDE_BENTO_STT_HF_TOKEN: ${ELIDE_STT_HF_TOKEN:-}
      LOG_LEVEL: ${ELIDE_LOG_LEVEL:-INFO}
    volumes:
      - hf_cache:/cache/huggingface:ro
    # Transcription is long-running (the service allows a 900s request), so the
    # probe gets a longer timeout than the other two.
    healthcheck:
      <<: *readyz
      timeout: 10s
    depends_on:
      stt-init:
        condition: service_completed_successfully

volumes:
  # hf_cache for NER and STT. OCR has its own, holding both OnnxTR's cache
  # (built-in architectures) and a Hugging Face cache (Hub models), so its
  # warmer never writes where another service reads. The services mount them
  # read-only; only the init containers write.
  hf_cache:
  ocr_cache:

networks:
  elide:
    # Named explicitly: without this Compose scopes it to the project and
    # creates `elide_elide`, so a server in another Compose project cannot
    # join `elide` by name and resolve ner/ocr/stt through it.
    name: elide
    driver: bridge
