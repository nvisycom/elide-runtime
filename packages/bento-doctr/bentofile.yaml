# Build from the repo root:  bentoml build -f packages/bento-doctr/bentofile.yaml .
# Image config (Python version, system packages, requirements) lives in
# service.py; this file selects the service and scopes the bundled source.
service: "bento_doctr.service:OcrService"
include:
  - "packages/bento-doctr/**"
  - "packages/bento-core/**"
  - "pyproject.toml"
  - "uv.lock"
