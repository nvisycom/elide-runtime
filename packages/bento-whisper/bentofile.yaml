# Build from the repo root:  bentoml build -f packages/bento-whisper/bentofile.yaml .
# Image config (Python version, system packages, requirements) lives in
# service.py; this file selects the service and scopes the bundled source.
service: "bento_whisper.service:SttService"
include:
  - "packages/bento-whisper/**"
  - "packages/bento-core/**"
  - "pyproject.toml"
  - "uv.lock"
