[project]
name = "bento-whisper"
version = "0.1.0"
description = "Default speech-to-text inference service for elide (faster-whisper)"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]
dependencies = [
    # PYSEC-2026-3545/3546/3547.
    "aiohttp>=3.14.3,<4",
    "bentoml>=1.4.39,<2",
    "bento-core",
    # Audio decoding: librosa reads whatever the image's ffmpeg understands.
    "librosa>=0.11,<1",
    "prometheus-client>=0.26.0",
    # ASR. WhisperX is deliberately not used: it pins huggingface-hub<1.0.0,
    # which cannot coexist with bento-gliner2's transformers>=5.15.0. Its
    # three stages are assembled directly instead — faster-whisper for
    # transcription, transformers' wav2vec2 for alignment, pyannote for
    # diarization — none of which carry that ceiling.
    "faster-whisper>=1.2,<2",
    # Forced alignment (wav2vec2) for the per-word timings the contract
    # carries; faster-whisper reports segment timings only.
    "transformers>=5.15.0",
    "torch>=2.8",
    "torchaudio>=2.8",
    # Speaker diarization.
    "pyannote-audio>=4.0,<5",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
