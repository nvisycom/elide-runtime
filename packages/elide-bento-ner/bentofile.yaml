# Build from the repo root:  bentoml build -f packages/elide-bento-ner/bentofile.yaml .
# Image config (Python version, requirements) lives in service.py; this file
# selects the service and scopes the bundled source.
service: "elide_bento_ner.service:NerService"
include:
  - "packages/elide-bento-ner/**"
  - "packages/elide-bento-core/**"
  - "pyproject.toml"
  - "uv.lock"
