# Build from the repo root:  bentoml build -f packages/elide-bento-vl/bentofile.yaml .
# Image config (Python version, system packages, requirements) lives in
# service.py; this file selects the service and scopes the bundled source.
service: "elide_bento_vl.service:OcrVlService"
include:
  - "packages/elide-bento-vl/**"
  - "packages/elide-bento-core/**"
  - "pyproject.toml"
  - "uv.lock"
