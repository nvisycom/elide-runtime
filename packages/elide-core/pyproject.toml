[project]
name = "elide-core"
version = "0.1.0"
description = "Shared wire-contract schema and types for elide-provider inference services"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]
dependencies = [
    # NER uses serialize_by_alias for the reserved schema_ → schema wire field.
    # The setting was introduced in 2.11; other wire names are snake_case directly.
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.14"]
build-backend = "uv_build"
