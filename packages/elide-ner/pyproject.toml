[project]
name = "elide-ner"
version = "0.1.0"
description = "Schema-driven NER inference service for elide (GLiNER2)"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]
dependencies = [
    # PYSEC-2026-3545/3546/3547.
    "aiohttp>=3.14.3,<4",
    "bentoml>=1.4.39,<2",
    # The sole inference engine (schema-driven). Major cap: pre-1.0 -> 1.x was
    # breaking.
    #
    # The `local` extra is what pulls torch: bare `gliner2` is the hosted-API
    # client and declares only pydantic/requests/tqdm/urllib3, so without the
    # extra the image ships no torch and the service fails at startup with
    # "No module named 'torch'". This service only ever runs the model locally
    # — the hosted path is asserted against in the test suite.
    "gliner2[local]>=1.3.2,<3",
    "transformers>=5.15.0",
    # Declared directly so the CPU-only index in the root pyproject.toml
    # applies: uv honours [tool.uv.sources] for direct dependencies only, and
    # torch arriving via the gliner2 extra would come from PyPI with its CUDA
    # payload.
    "torch>=2.8",
    "elide-core",
    "prometheus-client>=0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirror the workspace root: exclude real-model tests by default (run them with
# -m real). Pytest uses the nearest config when invoked inside this package, so
# the marker + exclusion must be declared here too, not only at the root.
addopts = ["-m", "not real"]
markers = [
    "real: exercises real model weights (downloads + inference); excluded by default, run with -m real",
]
