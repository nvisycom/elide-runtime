[project]
name = "elide-ocr"
version = "0.1.0"
description = "Default OCR inference service for elide (docTR)"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]
dependencies = [
    # PYSEC-2026-3545/3546/3547.
    "aiohttp>=3.14.3,<4",
    "bentoml>=1.4.39,<2",
    "elide-core",
    "onnx>=1.22.0",
    "pillow>=12.3.0,<14",
    "prometheus-client>=0.26.0",
    # docTR (PyTorch backend); torch/torchvision are core deps in 1.x, no extra.
    "python-doctr>=1.0,<2",
    # Declared directly, though docTR already requires them, so the CPU-only
    # index in the root pyproject.toml applies: uv honours [tool.uv.sources]
    # for direct dependencies only, and a transitive torch resolves from PyPI
    # with its CUDA payload (16 nvidia-* packages, ~6 GB in the image).
    "torch>=2.8",
    "torchvision>=0.23",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
