[project]
name = "elide-stt"
version = "0.1.0"
description = "Default speech-to-text inference service for elide (faster-whisper)"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]
dependencies = [
    # PYSEC-2026-3545/3546/3547.
    "aiohttp>=3.14.3,<4",
    "bentoml>=1.4.39,<2",
    "elide-core",
    # Audio decoding: librosa reads whatever the image's ffmpeg understands.
    "librosa>=0.11,<2",
    "prometheus-client>=0.26.0",
    # ASR, with native word timestamps: no separate alignment model.
    "faster-whisper>=1.2,<2",
    # Declared directly, torchcodec included though torchaudio already pulls
    # it, so the CPU-only index below applies: uv honours [tool.uv.sources]
    # for direct dependencies only, and a transitive torch package resolves
    # from PyPI with its CUDA payload.
    "torch>=2.8",
    "torchaudio>=2.8",
    "torchcodec>=0.7",
    # Speaker diarization.
    "pyannote-audio>=4.0,<5",
    "pydantic-settings>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
required-version = ">=0.7"
# The image is linux/amd64 and linux/arm64. Without this, a lock written on
# macOS records only the wheels that platform needs, and the in-image install
# fails its hash check: the linux wheel it downloads is not among the hashes
# the lockfile captured.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Security floors for packages that arrive only through bentoml's server stack,
# where the bentoml floor alone does not exclude a CVE. The same list is in
# every service and in the root tooling project.
constraint-dependencies = [
    "aiohttp>=3.14.0",         # CVE-2026-34993, CVE-2026-47265
    "anyio>=4.14.2",           # CVE-2026-63374, CVE-2026-64847
    "python-multipart>=0.0.31",  # CVE-2026-53540
    "setuptools>=83.0.0",      # PYSEC-2026-3447
    "soupsieve>=2.9.0",        # CVE-2026-85999, CVE-2026-86000
    "starlette>=1.3.1",        # CVE-2026-54282, CVE-2026-54283
    "tornado>=6.6",            # GHSA-pw9p-v7r6-gx4p, -r4j5-9xpp-3985, -pcg2-g6cj-q92c
    "ujson>=5.13.0",           # CVE-2026-54911
]

[tool.uv.sources]
elide-core = { path = "../elide-core", editable = true }
# CPU-only torch. The default PyPI wheels bundle CUDA: 16 nvidia-* packages,
# which is the difference between a ~1 GB image and a ~7 GB one. The CPU index
# ships the same torch without them. Linux and Windows only, because the CPU
# index publishes nothing else; macOS keeps PyPI's wheels, already CPU-only.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchcodec = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Not a general-purpose index: only the torch packages named in
# [tool.uv.sources] resolve from it, so an unrelated dependency cannot be
# shadowed by a same-named wheel here.
explicit = true

[build-system]
requires = ["uv_build>=0.12.4,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-model tests download weights and run inference, so they are excluded by
# default; run them with -m real.
addopts = ["-m", "not real"]
markers = [
    "real: exercises real model weights (downloads + inference); excluded by default, run with -m real",
]
