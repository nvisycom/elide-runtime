[project]
name = "nvisy-inference"
version = "0.1.0"
description = "Externalized model inference for nvisy (BentoML HTTP services)"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nvisy-core = { workspace = true }

[tool.uv]
required-version = ">=0.7"
# Transitive-only pins (not direct deps): security floors for packages that
# arrive via bentoml's server stack, where the bentoml floor alone does not
# exclude a CVE. Constrained workspace-wide so every service image picks up the
# fix without declaring the package directly.
constraint-dependencies = [
    "aiohttp>=3.14.0",         # CVE-2026-34993, CVE-2026-47265
    "python-multipart>=0.0.31",  # CVE-2026-53540
    "starlette>=1.3.1",        # CVE-2026-54282, CVE-2026-54283
    "tornado>=6.5.7",          # GHSA-pw6j-qg29-8w7f
    "ujson>=5.13.0",           # CVE-2026-54911
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode lets same-named test modules (test_service.py) coexist across
# packages without __init__.py files — see the src layout in packages/*.
# -m "not real": the default run excludes real-model tests (they download
# weights + run inference); the opt-in `real-models` CI job runs `-m real`.
# List form so the marker expression isn't mangled by string-splitting.
addopts = ["--import-mode=importlib", "-m", "not real"]
markers = [
    "real: exercises real model weights (downloads + inference); excluded by default, run with -m real",
]
