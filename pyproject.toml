[project]
name = "elide-provider"
version = "0.1.0"
description = "Externalized model inference for elide (BentoML HTTP services)"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
authors = [{ name = "Nvisy" }]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
elide-core = { workspace = true }
# CPU-only torch. All three services run on CPU, but the default PyPI wheels
# bundle CUDA: 16 nvidia-* packages, which is the difference between a ~0.9 GB
# image and a ~7 GB one. The CPU index ships the same torch without them.
# Resolved per-platform because the CPU wheels are published for linux and
# windows only; macOS keeps PyPI's wheels, which are already CPU-only there.
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchcodec = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Not a general-purpose index: only the torch packages above resolve from it,
# so an unrelated dependency cannot be shadowed by a same-named wheel here.
explicit = true

[tool.uv]
required-version = ">=0.7"
# The service images are linux/amd64 and linux/arm64. Without this, resolving
# on a developer's macOS records only the wheels that platform needs, and the
# in-image install fails with a hash mismatch: the linux wheel it downloads is
# not among the hashes the lockfile captured. Forcing both targets makes the
# lock (and so each exported requirements.txt) carry every hash the images
# install, whichever machine ran `uv lock`.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Transitive-only pins (not direct deps): security floors for packages that
# arrive via bentoml's server stack, where the bentoml floor alone does not
# exclude a CVE. Constrained workspace-wide so every service image picks up the
# fix without declaring the package directly.
constraint-dependencies = [
    "aiohttp>=3.14.0",         # CVE-2026-34993, CVE-2026-47265
    "anyio>=4.14.2",           # CVE-2026-63374, CVE-2026-64847
    "python-multipart>=0.0.31",  # CVE-2026-53540
    "setuptools>=83.0.0",      # PYSEC-2026-3447
    "soupsieve>=2.9.0",        # CVE-2026-85999, CVE-2026-86000
    "starlette>=1.3.1",        # CVE-2026-54282, CVE-2026-54283
    "tornado>=6.5.8",          # GHSA-pw6j-qg29-8w7f, -wwv5-g3v4-889x, -8423-8fgw-73vq
    "ujson>=5.13.0",           # CVE-2026-54911
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
e2e = [
    "bentoml>=1.4.39,<2",
    "librosa>=0.11,<2",
    "numpy>=2,<3",
    "pillow>=12.3,<14",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.12,<3",
    "uvicorn>=0.35,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["packages"]
# importlib mode lets same-named test modules (test_service.py) coexist across
# packages without __init__.py files — see the src layout in packages/*.
# -m "not real": the default run excludes real-model tests (they download
# weights + run inference); the opt-in `real-models` CI job runs `-m real`.
# List form so the marker expression isn't mangled by string-splitting.
addopts = ["--import-mode=importlib", "-m", "not real"]
markers = [
    "real: exercises real model weights (downloads + inference); excluded by default, run with -m real",
]
